[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aos"
version = "0.1.0"
description = "AOS — Governance-first, multi-venture agentic operating system"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13.1",
    "langgraph>=0.2",
    "httpx>=0.27",
    "networkx>=3.6.1",
    "python-dotenv>=1.0",
    "cocoindex>=0.1",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aos = "aos.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require live dependencies)",
]

[tool.coverage.run]
source = ["aos", "odysseus"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true