[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tazos"
version = "0.1.0"
description = "TAZ OS — Governance-first, multi-venture agentic operating system"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.scripts]
tazos = "tazos.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
