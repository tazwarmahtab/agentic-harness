# TAZ OS Operations Harness
id: HAR-OPS-001
name: Operations Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
criticality: high
mission: >
  Execute projects end-to-end: site assessment, procurement, installation
  tracking, quality assurance, and maintenance scheduling. Ensure all
  installations meet engineering standards and safety requirements.

scope:
  in_scope: [procurement, installation, qa, maintenance, site_assessment]
  out_of_scope: [financial_modeling, customer_outreach, investor_relations]

kpis:
  - { name: milestone_hit_rate, target: ">90%" }
  - { name: quality_incidents, target: "0" }
  - { name: procurement_approval_compliance, target: "100%" }

outputs:
  - { name: site_assessments, type: artifact }
  - { name: installation_reports, type: artifact }
  - { name: procurement_logs, type: artifact }

inputs:
- { source: founder_context, items: [priority_list, handoffs] }
- { source: knowledge, items: [engineering_standards, safety_protocols] }
- { source: projects, items: [procurement_logs, installation_schedules] }


components:
  planner: planner.yml
  dispatcher: dispatcher.yml
  specialists_dir: specialists/
  memory: memory.yml
  tools: tools.yml
  approvals: approvals.yml
  evaluation: evaluation.yml
ame: Operations Loop
trigger: daily_07:00_BDT
steps:
  - action: review
    target: [site_assessments, procurement_status, installation_schedules, qa_results]
  - action: plan
    target: planner
  - action: delegate
    target: dispatcher
  - action: execute
    target: specialists
  - action: escalate
    target: approval_gates
  - action: log
    target: decision_log
name: Operations Loop
trigger: daily_07:00_BDT
steps:
  - review: [site_assessments, procurement_status, installation_schedules, qa_results]
  - plan: planner
  - delegate: dispatcher
  - execute: specialists
  - escalate: approval_gates
  - log: decision_log

execution_cycle:
  name: Operations Loop
  trigger: daily_07:00_BDT
  steps:
    - action: review
      target: [site_assessments, procurement_status, installation_schedules, qa_results]
    - action: plan
      target: planner
    - action: delegate
      target: dispatcher
    - action: execute
      target: specialists
    - action: escalate
      target: approval_gates
    - action: log
      target: decision_log
