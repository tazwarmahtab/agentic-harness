# Operations Harness — Dispatcher
id: AGT-OPS-DISPATCH
name: Operations Dispatcher
harness: HAR-OPS-001
version: 1.0.0
status: production
criticality: critical
mission: "Route tasks to the correct specialist within the Operations harness."
allowed_memory:
  read: [all_long_term]
  write: []
  cannot_read: [founder_personal_notes]
allowed_tools:
  - { capability: read_memory, permission: read }
  - { capability: write_memory, permission: request_approval }
  - { capability: invoke_specialist, permission: execute }
reasoning_structure:
  - read_priority_list
  - match_task_to_agent
  - create_assignments
  - output_assignments
