# TAZ OS OPERATIONS HARNESS — Approval Gates

id: POL-OPS-001
name: Operations Approval Gates
harness: HAR-OPS-001
version: 1.0.0
status: production

rules:
  - id: POL-OPS-OPS-001
    name: Purchase Order Approval
    category: operations
    rule:
      if:
        action: create_po
      then: "Route to Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 48

  - id: POL-OPS-OPS-002
    name: Supplier Selection
    category: operations
    rule:
      if:
        action: select_supplier
        value_bdt: { greater_than: 1000000 }
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 48

  - id: POL-OPS-OPS-003
    name: Safety Protocol Deviation
    category: engineering
    rule:
      if:
        action: deviate_from_safety_protocol
      then: "Immediate escalation to Founder."
    action: escalate
    approval_owner: HUM-000001

auto_actions:
  - update_dashboard
  - log_installation_progress
  - generate_site_report
  - update_quality_checklist
  - read_file
  - update_procurement_log

decision_queue_format:
  bundled: true
  summary_per_decision:
    - action_description
    - financial_impact
    - risk_assessment
  actions_available: [approve_all, review_individually, reject]
  delivery: console_queue

delegation:
  enabled: true
  rule: "Delegation is explicit and temporary."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
