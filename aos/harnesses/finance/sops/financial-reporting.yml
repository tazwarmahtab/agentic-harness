# SOP-FIN-001 — Financial Reporting Cycle
# Owner: AGT-FIN-CASH (cash flow) + AGT-FIN-UNIT (models) + AGT-FIN-DECK (reports)
# Frequency: Weekly/Monthly, triggered by schedule or cross-harness dispatch
# Purpose: Standardized financial reporting with ground-truth enforcement

id: SOP-FIN-001
name: Financial Reporting Cycle
owner: AGT-FIN-CASH
version: 1.0.0
trigger: weekly_friday_17:00_BDT

phase_1_gather:
  owner: AGT-FIN-CASH
  actions:
    - read: ground_truth_constants (always start with truth)
    - read: cash_flow_history, receivables, payables
    - read: current_pipeline values from CRM
    - collect: actuals vs forecast for the period

phase_2_analyze:
  owner: AGT-FIN-UNIT
  actions:
    - calculate: unit economics per project
    - validate: all numbers against ground truth constants
    - check: DSCR against 2.25x (Scenario A) floor
    - flag: any blended rate usage (HARD FAIL)
    - produce: variance_report with insights

phase_3_report:
  owner: AGT-FIN-DECK
  actions:
    - compose: financial summary using approved templates
    - include: cash position, runway, DSCR, pipeline value
    - validate: all numbers match ground truth
    - route: for founder approval if investor-facing
    - output: report_draft

phase_4_review:
  owner: HUM-000001
  actions:
    - review: financial report
    - approve: or request corrections
    - flag: strategic decisions needed
    - output: approved_report

brief_format: |
  Financial Summary — [Period]

  Cash Position: BDT [X]
  Runway: [X] months
  DSCR (Scenario A): [X]x (floor: 2.25x)
  Pipeline Value: BDT [X]
  Receivables Overdue: BDT [X]

  Key Variances:
  - [Item]: forecast BDT [X] vs actual BDT [X]

  Decisions Needed:
  - [Any approvals or strategic calls]
