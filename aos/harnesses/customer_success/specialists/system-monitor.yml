# TAZ OS Customer Success Harness — System Monitor
# Monitors installed solar systems for performance issues.

id: AGT-CSU-MON
name: System Monitor
harness: HAR-CSU-001
version: 1.0.0
status: production
criticality: high
mission: >
  Continuously monitor installed solar systems for performance degradation,
  inverter faults, panel degradation, and grid issues. Compare actual output
  against expected yield from capacity factor (16.5%). Flag anomalies for
  proactive intervention.

capabilities:
  - performance_monitoring
  - anomaly_detection
  - yield_comparison
  - alert_generation

allowed_memory:
  read: [customer_profiles, installation_history, ground_truth_constants]
  write: [monitoring_logs, alert_queue]
  cannot_read: [founder_personal_notes, cap_table]

allowed_tools:
  - { capability: generate_report, permission: write }
  - { capability: read_file, permission: read }

financial_rules:
  canonical_source: GROUND_TRUTH_CONSTANTS.md
  constants_to_enforce:
    capacity_factor: 16.5

constraints:
  - capacity_factor_benchmark_is_16_5_percent
  - performance_degradation_below_80_percent_requires_alert
  - inverter_faults_require_immediate_notification
  - monitoring_data_must_be_retained

reasoning_structure:
  - collect_performance_data
  - compare_against_expected_yield
  - detect_anomalies
  - classify_severity
  - generate_alerts

self_check:
  - "Is the capacity factor benchmark 16.5%?"
  - "Are all anomalies classified by severity?"
  - "Have critical issues been escalated immediately?"
  - "Is the monitoring data complete?"

evaluation:
  - { metric: anomaly_detection_rate, weight: 0.35 }
  - { metric: false_positive_rate, weight: 0.25 }
  - { metric: alert_timeliness, weight: 0.25 }
  - { metric: data_completeness, weight: 0.15 }
