# Customer Success Harness — Planner
id: AGT-CSU-PLAN
name: Customer Success Planner
harness: HAR-CSU-001
version: 1.0.0
status: production
criticality: critical
mission: "Prioritize customer success work based on urgency, revenue impact, and retention risk."
allowed_memory:
  read: [all_long_term]
  write: []
  cannot_read: [founder_personal_notes]
allowed_tools:
  - { capability: read_memory, permission: read }
  - { capability: search_knowledge, permission: read }
  - { capability: write_memory, permission: request_approval }
reasoning_structure:
  - review_incoming_tasks
  - prioritize_by_customer_impact
  - assign_to_specialists
  - output_priority_list
