# TAZ OS CUSTOMER SUCCESS HARNESS — Evaluation Metrics

id: EVAL-CSU-001
name: Customer Success Harness Evaluation Framework
harness: HAR-CSU-001
version: 1.0.0

harness_metrics:
  - name: sla_compliance_rate
    target: ">99%"
    frequency: weekly
    owner: AGT-CSU-MONITOR
    measurement: tickets_resolved_within_sla

  - name: customer_satisfaction_score
    target: ">4.5/5"
    frequency: monthly
    owner: AGT-CSU-SUP
    measurement: average_csat_after_resolution

  - name: issue_prediction_accuracy
    target: ">80%"
    frequency: monthly
    owner: AGT-CSU-DETECT
    measurement: predicted_issues_that_occurred

  - name: upsell_conversion_rate
    target: ">20%"
    frequency: monthly
    owner: AGT-CSU-UPSELL
    measurement: upsells_closed_divided_by_offered

specialist_metrics:
  AGT-CSU-DETECT:
    - prediction_accuracy: { weight: 0.35 }
    - early_detection_rate: { weight: 0.30 }
    - false_positive_rate: { weight: 0.20 }
    - response_time: { weight: 0.15 }

  AGT-CSU-SUP:
    - resolution_time: { weight: 0.30 }
    - first_contact_resolution: { weight: 0.25 }
    - customer_satisfaction: { weight: 0.25 }
    - documentation_quality: { weight: 0.20 }

  AGT-CSU-MONITOR:
    - uptime_accuracy: { weight: 0.35 }
    - alert_precision: { weight: 0.25 }
    - report_timeliness: { weight: 0.25 }
    - coverage_completeness: { weight: 0.15 }

  AGT-CSU-UPSELL:
    - conversion_rate: { weight: 0.30 }
    - customer_relevance: { weight: 0.25 }
    - proposal_quality: { weight: 0.25 }
    - approval_compliance: { weight: 0.20 }

continuous_improvement:
  cycle:
    - step: compare_planned_vs_actual
      owner: AGT-CSU-MONITOR
      input: support_outcomes
      output: variance_report
    - step: identify_bottlenecks
      owner: AGT-CSU-SUP
      input: variance_report
      output: bottleneck_list
    - step: update_artifacts
      owner: AGT-CSU-SUP
      input: bottleneck_list
      output: updated_playbook
      artifacts_affected: [troubleshooting_playbook, upsell_playbook]
    - step: record_lessons
      owner: AGT-CSU-SUP
      input: bottleneck_list
      output: new_lessons
    - step: update_benchmarks
      owner: AGT-CSU-MONITOR
      input: specialist_metrics
      output: benchmark_update
    - step: founder_review
      owner: HUM-000001
      input: monthly_review
      output: approved_or_revised
      frequency: monthly

  improvement_sources:
    - customer_feedback: "CSAT and resolution feedback"
    - support_tickets: "resolution patterns and common issues"
    - system_performance: "uptime and incident data"

  metrics_tracked:
    - average_resolution_time
    - sla_compliance_rate
    - customer_satisfaction_score
    - hard_fail_count_per_period

  review_cadence:
    daily: [system_status, ticket_status]
    weekly: [sla_review, issue_patterns]
    monthly: [customer_health_score, upsell_pipeline]
    quarterly: [full_cs_audit, playbook_update]

evaluation_pipeline:
  1. agent_completes_task:
     output: raw_result
  2. self_check_passes:
     condition: all self_check questions return true
  3. evaluator_scores:
     metrics: specialist_metrics[agent_id]
     hard_fail_check: any metric with hard_fail_if condition
  4. result:
     - pass: store_artifact + update_memory
     - fail_hard: reject_output + alert_founder + log_failure
     - fail_soft: return_to_agent_with_feedback + retry
     - low_confidence: escalate_to_founder_with_context
