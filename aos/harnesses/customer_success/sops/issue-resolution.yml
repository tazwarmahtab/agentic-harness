# SOP-CSU-001 — Issue Resolution
# Owner: AGT-CSU-DETECT (detect) + AGT-CSU-SUP (resolve) + AGT-CSU-MONITOR (monitor)
# Frequency: Realtime, triggered by alert or customer report
# Purpose: End-to-end issue detection, resolution, and prevention

id: SOP-CSU-001
name: Issue Resolution
owner: AGT-CSU-SUP
version: 1.0.0
trigger: realtime

phase_1_detect:
  owner: AGT-CSU-DETECT or AGT-CSU-MONITOR
  actions:
    - monitor: system performance metrics
    - predict: potential issues from patterns
    - classify: severity (low/medium/high/critical)
    - output: issue_alert with severity and affected_system

phase_2_triage:
  owner: AGT-CSU-SUP
  actions:
    - read: customer_records and sla_definitions
    - prioritize: based on severity and SLA
    - assign: resolution path (standard/escalate)
    - output: triage_decision

phase_3_resolve:
  owner: AGT-CSU-SUP
  actions:
    - follow: troubleshooting_playbook
    - apply: fix or workaround
    - verify: resolution with customer
    - document: solution in support_tickets
    - output: resolution_record

phase_4_prevent:
  owner: AGT-CSU-DETECT
  actions:
    - analyze: root cause
    - update: troubleshooting_playbook with new pattern
    - adjust: monitoring thresholds if needed
    - output: prevention_update

escalation:
  - trigger: critical_system_down
    notify: AGT-CSU-MONITOR + HUM-000001
    urgency: immediate
  - trigger: sla_breach_imminent
    notify: AGT-CSU-SUP + HUM-000001
    urgency: high
