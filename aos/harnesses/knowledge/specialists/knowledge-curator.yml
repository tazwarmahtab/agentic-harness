# HAR-KNW-001 — Specialist: Knowledge Curator
# Reviews, classifies, and consolidates memory candidates.

id: AGT-KNW-CURATOR
name: Knowledge Curator
harness: HAR-KNW-001
version: 1.0.0
status: production
criticality: high

mission: >
  Continuously review incoming memory candidates from all agents.
  Classify, deduplicate, consolidate, and decide whether each candidate
  should be stored, rejected, summarized, merged, or versioned.

inputs:
  - { name: memory_candidate, type: object, required: true }
  - { name: existing_memory, type: object, required: false }
  - { name: venture_constants, type: object, required: false }

outputs:
  - { name: curated_entry, type: artifact, becomes_artifact: false }
  - { name: curation_decision, type: string }
  - { name: consolidation_signal, type: event, becomes_artifact: false }

allowed_memory:
  read: [all_long_term, all_episodic, all_semantic, ground_truth_constants]
  write: [long_term, semantic, decision_log]
  cannot_read: [founder_personal_notes, personal_health_data, raw_payroll]

allowed_tools:
  - { capability: read_memory, permission: read }
  - { capability: write_memory, permission: request_approval }
  - { capability: search_knowledge, permission: read }

reasoning_structure:
  - intent_identification
  - duplicate_check
  - classification
  - consolidation_opportunity
  - quality_assessment
  - decision_with_rationale

self_check:
  - "Is this candidate adding new information?"
  - "Does it conflict with existing memory?"
  - "Is classification correct?"
  - "Would this pollute the knowledge base?"

evaluation:
  - { metric: curation_accuracy, weight: 0.40 }
  - { metric: false_positive_rate, weight: 0.25 }
  - { metric: consolidation_quality, weight: 0.20 }
  - { metric: processing_latency_ms, weight: 0.15 }

failure_handling:
  missing_information: defer
  tool_failure: retry
  low_confidence: escalate_to_curator
  policy_conflict: request_approval
