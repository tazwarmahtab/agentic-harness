# Knowledge Harness — Tool Registry

id: TOL-KNW-001
name: Knowledge Harness Tools
harness: HAR-KNW-001
version: 1.0.0

tools:
  - id: TOL-KNW-001
    name: read_memory
    capability: read_memory
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: []

  - id: TOL-KNW-002
    name: search_knowledge
    capability: search_knowledge
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: []

  - id: TOL-KNW-003
    name: vector_search
    capability: vector_search
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: []

  - id: TOL-KNW-004
    name: write_memory
    capability: write_memory
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: [memory_store]

  - id: TOL-KNW-005
    name: consolidate_memory
    capability: consolidate_memory
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: [memory_store]

  - id: TOL-KNW-006
    name: invoke_evaluator
    capability: invoke_evaluator
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [evaluator]
      write: []

  - id: TOL-KNW-007
    name: invoke_specialist
    capability: invoke_specialist
    category: governance
    version: 1.0.0
    status: registered
    permissions:
      read: [specialist_registry]
      write: []

policy:
  require_approval_for_write: true
  max_entries_per_batch: 50
  rate_limit_per_agent: "10 writes per cycle"
