# TAZ OS Investor Relations Harness
# Manages investor relationships, fundraising, and financial reporting.

id: HAR-INV-001
name: Investor Relations Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
criticality: high
mission: >
  Manage all investor relations: track investor CRM, prepare pitch decks,
  handle due diligence, generate financial projections, and manage the
  fundraising pipeline. All investor communications require founder approval.

scope:
  in_scope: [investor_crm, pitch_deck, due_diligence, financial_projections, fundraising]
  out_of_scope: [engineering, procurement, customer_outreach, operations]

kpis:
  - { name: investor_response_rate, target: ">60%" }
  - { name: due_diligence_completion, target: "100%" }
  - { name: projection_accuracy, target: ">90%" }
  - { name: fundraising_milestone_hit, target: "100%" }

outputs:
  - { name: pitch_decks, type: artifact }
  - { name: investor_updates, type: artifact }
  - { name: due_diligence_packs, type: artifact }

inputs:
- { source: founder_context, items: [priority_list, handoffs] }
- { source: knowledge, items: [investor_profiles, pitch_templates] }
- { source: venture_artifact, ref: financial_projections }


components:
  planner: planner.yml
  dispatcher: dispatcher.yml
  specialists_dir: specialists/
  memory: memory.yml
  tools: tools.yml
  approvals: approvals.yml
  evaluation: evaluation.yml
ame: Investor Relations Loop
trigger: weekly_monday_09:00_BDT
steps:
  - action: review
    target: [investor_contacts, fundraising_pipeline, financial_projections]
  - action: plan
    target: planner
  - action: delegate
    target: dispatcher
  - action: execute
    target: specialists
  - action: review
    target: evaluation
  - action: log
    target: decision_log
name: Investor Relations Loop
trigger: weekly_monday_09:00_BDT
steps:
  - review: [investor_contacts, fundraising_pipeline, financial_projections]
  - plan: planner
  - delegate: dispatcher
  - execute: specialists
  - review: evaluation
  - log: decision_log

execution_cycle:
  name: Investor Relations Loop
  trigger: weekly_monday_09:00_BDT
  steps:
    - action: review
      target: [investor_contacts, fundraising_pipeline, financial_projections]
    - action: plan
      target: planner
    - action: delegate
      target: dispatcher
    - action: execute
      target: specialists
    - action: review
      target: evaluation
    - action: log
      target: decision_log
