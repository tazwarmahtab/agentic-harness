# Investor Relations Harness — Dispatcher
id: AGT-INV-DISPATCH
name: Investor Relations Dispatcher
harness: HAR-INV-001
version: 1.0.0
status: production
criticality: critical
mission: "Route investor relations tasks to the correct specialist."
allowed_memory:
  read: [all_long_term]
  write: []
  cannot_read: [founder_personal_notes, payroll_details]
allowed_tools:
  - { capability: read_memory, permission: read }
  - { capability: write_memory, permission: request_approval }
  - { capability: invoke_specialist, permission: execute }
reasoning_structure:
  - read_priority_list
  - match_task_to_agent
  - create_assignments
  - output_assignments
