# TAZ OS INVESTOR RELATIONS HARNESS — Evaluation Metrics

id: EVAL-INV-001
name: Investor Relations Harness Evaluation Framework
harness: HAR-INV-001
version: 1.0.0

harness_metrics:
  - name: investor_update_timeliness
    target: "100% on schedule"
    frequency: monthly
    owner: AGT-INV-DECK
    measurement: updates_sent_by_deadline

  - name: pipeline_conversion_rate
    target: ">10%"
    frequency: quarterly
    owner: AGT-INV-TRACK
    measurement: investors_converted_divided_by_engaged

  - name: dd_preparation_readiness
    target: "100%"
    frequency: realtime
    owner: AGT-INV-DD
    measurement: all_dd_documents_current_and_complete

  - name: projection_accuracy
    target: ">90%"
    frequency: quarterly
    owner: AGT-INV-PROJ
    measurement: projection_vs_actual_variance

specialist_metrics:
  AGT-INV-CRM:
    - relationship_management: { weight: 0.30 }
    - communication_quality: { weight: 0.25 }
    - data_accuracy: { weight: 0.25 }
    - follow_up_timeliness: { weight: 0.20 }

  AGT-INV-DECK:
    - presentation_quality: { weight: 0.30 }
    - narrative_coherence: { weight: 0.25 }
    - data_accuracy: { weight: 0.25, hard_fail_if: "wrong_financial_constants" }
    - founder_approval_rate: { weight: 0.20 }

  AGT-INV-DD:
    - document_completeness: { weight: 0.35 }
    - response_quality: { weight: 0.30 }
    - timeliness: { weight: 0.20 }
    - accuracy: { weight: 0.15 }

  AGT-INV-PROJ:
    - model_accuracy: { weight: 0.35, hard_fail_if: "blended_rate_for_savings" }
    - assumption_documentation: { weight: 0.25 }
    - scenario_coverage: { weight: 0.20 }
    - presentation_clarity: { weight: 0.20 }

  AGT-INV-TRACK:
    - pipeline_accuracy: { weight: 0.30 }
    - milestone_tracking: { weight: 0.25 }
    - reporting_timeliness: { weight: 0.25 }
    - conversion_forecast_accuracy: { weight: 0.20 }

continuous_improvement:
  cycle:
    - step: compare_planned_vs_actual
      owner: AGT-INV-TRACK
      input: fundraising_outcomes
      output: variance_report
    - step: identify_bottlenecks
      owner: AGT-INV-TRACK
      input: variance_report
      output: bottleneck_list
    - step: update_artifacts
      owner: AGT-INV-DECK
      input: bottleneck_list
      output: updated_materials
      artifacts_affected: [pitch_materials, fundraising_playbook]
    - step: record_lessons
      owner: AGT-INV-CRM
      input: bottleneck_list
      output: new_lessons
    - step: founder_review
      owner: HUM-000001
      input: quarterly_review
      output: approved_or_revised
      frequency: quarterly

  improvement_sources:
    - investor_feedback: "responses and questions from investors"
    - pipeline_analysis: "conversion patterns and blockers"
    - projection_accuracy: "model vs actual performance"

  metrics_tracked:
    - investor_engagement_rate
    - fundraising_velocity
    - projection_accuracy
    - hard_fail_count_per_period

  review_cadence:
    daily: [pipeline_status, follow_up_check]
    weekly: [investor_engagement_review, material_update]
    monthly: [investor_update, projection_refresh]
    quarterly: [fundraising_strategy_review, full_audit]

evaluation_pipeline:
  1. agent_completes_task:
     output: raw_result
  2. self_check_passes:
     condition: all self_check questions return true
  3. evaluator_scores:
     metrics: specialist_metrics[agent_id]
     hard_fail_check: any metric with hard_fail_if condition
  4. result:
     - pass: store_artifact + update_memory
     - fail_hard: reject_output + alert_founder + log_failure
     - fail_soft: return_to_agent_with_feedback + retry
     - low_confidence: escalate_to_founder_with_context
