# TAZ OS INVESTOR RELATIONS HARNESS — Approval Gates

id: POL-INV-001
name: Investor Relations Approval Gates
harness: HAR-INV-001
version: 1.0.0
status: production

rules:
  - id: POL-INV-INV-001
    name: Investor Communication
    category: commercial
    rule:
      if:
        action: send_communication
        recipient_type: investor
      then: "Block. Founder must approve all investor comms."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 48

  - id: POL-INV-INV-002
    name: Data Room Sharing
    category: commercial
    rule:
      if:
        action: share_data_room
        classification: [confidential, restricted]
      then: "Block. Founder must approve."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 72

  - id: POL-INV-INV-003
    name: Pitch Deck External Send
    category: commercial
    rule:
      if:
        action: send_pitch_deck
      then: "Block. Founder must review content."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

auto_actions:
  - update_crm
  - draft_communication
  - track_pipeline
  - generate_internal_report
  - update_projection_model

decision_queue_format:
  bundled: true
  summary_per_decision: [action_description, risk_assessment]
  actions_available: [approve_all, review_individually, reject]
  delivery: console_queue

delegation:
  enabled: true
  rule: "Delegation is explicit and temporary."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
