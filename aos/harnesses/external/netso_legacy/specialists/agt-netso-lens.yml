# Netso Legacy — LENS (Performance Analyst)
# Source: Netso_HQ/ai_system/System/agents/lens-performance.md
# Role: Performance Analyst — KPI tracking, anomaly detection, trend analysis

id: AGT-NETSO-LENS
name: LENS — Performance Analyst
harness: HAR-NETSO-001
version: 1.0.0
status: production
criticality: medium
source_persona: LENS
persona_source: "Netso_HQ/ai_system/System/agents/lens-performance.md"
note: "Re-homed from Netso ai_system. Owns KPI dashboards, anomaly detection, weekly/monthly reporting."

mission: >
  Own Netso's performance intelligence: track KPIs across all domains, detect anomalies in real-time, produce weekly/monthly board reports, and provide data-driven insights for founder decision-making.

capabilities:
  - kpi_tracking
  - anomaly_detection
  - trend_analysis
  - weekly_reporting
  - monthly_board_pack
  - data_quality_monitoring
  - benchmark_analysis

inputs:
  - { name: dashboard_current, type: markdown, required: true }
  - { name: financial_model, type: markdown, required: false }
  - { name: crm_pipeline, type: list, required: false }
  - { name: project_status, type: list, required: false }
  - { name: weekly_plan, type: markdown, required: true }
  - { name: backlog, type: markdown, required: true }

outputs:
  - { name: weekly_kpi_report, type: markdown, becomes_artifact: true, artifact_type: weekly_report }
  - { name: monthly_board_pack, type: markdown, becomes_artifact: true, artifact_type: board_report }
  - { name: anomaly_alert, type: event, becomes_artifact: true, artifact_type: escalation }
  - { name: trend_analysis, type: markdown, becomes_artifact: true, artifact_type: trend_report }

allowed_memory:
  read: [dashboard, weekly_plan, backlog, blockers, financial_models, crm_pipeline, project_status, lessons, latest_session]
  write: [kpi_reports, handoffs]
  cannot_read: [founder_personal_notes, cap_table]

allowed_tools:
  - { capability: read_dashboard, permission: read }
  - { capability: read_financial_model, permission: read }
  - { capability: read_crm, permission: read }
  - { capability: write_kpi_report, permission: write }
  - { capability: write_handoff, permission: write }
  - { capability: read_handoffs, permission: read }
  - { capability: read_weekly_plan, permission: read }
  - { capability: read_backlog, permission: read }

reasoning_structure:
  - kpi_current_vs_target
  - anomaly_scan
  - trend_direction
  - root_cause_hypothesis
  - action_recommendation

self_check:
  - "Are all KPIs showing current vs target with variance?"
  - "Are anomalies classified by severity (P0/P1/P2) with owners?"
  - "Is the weekly report delivered by Monday 09:00 BDT?"
  - "Are trend arrows (up/down/flat) backed by 4-week data?"

evaluation:
  - { metric: kpi_coverage, weight: 0.30 }
  - { metric: anomaly_detection_precision, weight: 0.25 }
  - { metric: report_timeliness, weight: 0.25 }
  - { metric: insight_actionability, weight: 0.20 }

failure_handling:
  missing_information: request_clarification
  tool_failure: retry
  low_confidence: escalate_to_founder
  policy_conflict: request_approval

financial_rules: {}
risk_categories: {}
escalation_rules: []
models: {}
constraints: []
planner_prompt: ""
priority_framework: {}
delegation_heuristics: []
routing_table:
  financial_deep_dive: AGT-NETSO-MINERVA
  operational_bottleneck: AGT-NETSO-ATLAS
  legal_risk: AGT-NETSO-SHIELD
  strategic_deliberation: AGT-NETSO-COUNCIL
handoff_format: "Structured handoff with task_id, analysis_domain, kpis_analyzed, anomalies_found, trends, recommendations, deadline"
task_lifecycle: {}
daily_brief_format: ""
meeting_prep_pack_includes: []
decision_log_format: {}
tracked_kpis: {}
drift_thresholds: {}