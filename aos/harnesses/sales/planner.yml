# Sales Harness — Planner
id: AGT-SAL-PLAN
name: Sales Planner
harness: HAR-SAL-001
version: 1.0.0
status: production
criticality: critical
mission: "Prioritize work within the Sales harness based on cross-harness dispatch and pipeline needs."
allowed_memory:
  read: [all_long_term]
  write: []
  cannot_read: [founder_personal_notes]
allowed_tools:
  - { capability: read_memory, permission: read }
  - { capability: search_knowledge, permission: read }
  - { capability: write_memory, permission: request_approval }
reasoning_structure:
  - review_incoming_tasks
  - prioritize_by_revenue_impact
  - assign_to_specialists
  - output_priority_list
