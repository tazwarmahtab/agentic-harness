# TAZ OS SALES HARNESS — Shared Memory
# Three layers: Long-term (CRM, constants), Episodic (deals, outreach), Semantic (playbook, pricing).

id: MEM-SAL-001
name: Sales Harness Shared Memory
harness: HAR-SAL-001
version: 1.0.0

# ===========================================================================
# MEMORY LAYERS
# ===========================================================================
layers:
  long_term:
    ground_truth_constants:
      ref: ground_truth_constants
      description: "All financial numbers from core_economics.py. NEVER edit manually."
      classification: confidential
    crm_pipeline:
      description: "Active leads, deal stages, pipeline value, conversion history"
      classification: internal
    customer_segments:
      description: "ICP definitions: Bangladesh RMG rooftop solar, BOO/OPEX model"
      classification: internal
    customer_records:
      ref: crm/
      description: "Individual customer contacts, communication history, PPA status"
      classification: confidential
    product_catalog:
      description: "Netso offerings, pricing tiers, package definitions"
      classification: internal
    competitor_intelligence:
      description: "Market positioning, competitor pricing, win/loss analysis"
      classification: internal

  episodic:
    deals_log:
      description: "All deal movements: stage changes, value updates, close dates"
      write_access: [AGT-SAL-LEAD, AGT-SAL-PROP]
      classification: internal
    outreach_history:
      description: "Email, LinkedIn, WhatsApp outreach records with response tracking"
      write_access: [AGT-SAL-OUT]
      classification: internal
    proposal_versions:
      description: "Versioned proposal documents with approval status"
      write_access: [AGT-SAL-PROP]
      classification: confidential
    meeting_notes:
      description: "Customer meeting summaries and action items"
      classification: confidential
    follow_up_tracker:
      description: "Pending follow-ups with SLA deadlines"
      write_access: [AGT-SAL-OUT]
      classification: internal

  semantic:
    sales_playbook:
      description: "Qualification criteria, objection handling, closing techniques"
      classification: internal
    pricing_rules:
      description: "PPA rate structure, escalation terms, margin targets"
      classification: confidential
    icp_definition:
      description: "Ideal Customer Profile — Bangladesh RMG factories, >500kW load"
      classification: internal
    objection_handlers:
      description: "Common objections and approved responses"
      classification: internal
    approval_rules:
      ref: approvals.yml
      description: "When deals need founder approval"
      classification: internal

# ===========================================================================
# MEMORY PERMISSIONS — per-specialist least-privilege
# ===========================================================================
permissions:
  AGT-SAL-LEAD:
    read: [crm_pipeline, customer_segments, customer_records, ground_truth_constants, sales_playbook, icp_definition]
    write: [deals_log, crm_pipeline]
    cannot_read: [founder_personal_notes, investor_correspondence]

  AGT-SAL-OUT:
    read: [crm_pipeline, customer_records, sales_playbook, objection_handlers, outreach_history]
    write: [outreach_history, follow_up_tracker]
    cannot_read: [founder_personal_notes, ground_truth_constants, financial_models]

  AGT-SAL-PROP:
    read: [ground_truth_constants, pricing_rules, product_catalog, customer_records, deals_log, sales_playbook]
    write: [proposal_versions, deals_log]
    cannot_read: [founder_personal_notes, investor_correspondence, cap_table]

# ===========================================================================
# MEMORY UPDATE RULES
# ===========================================================================
update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution. No agent can write arbitrary memory."
  audit: "every memory write creates immutable audit record"
