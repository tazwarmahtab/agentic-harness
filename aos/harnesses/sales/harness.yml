# TAZ OS Sales Harness
id: HAR-SAL-001
name: Sales Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
criticality: critical
mission: >
  Drive revenue by managing the sales pipeline: lead qualification,
  customer outreach, proposal generation, LOI management, and deal closure.
  All proposals must pass through approval gates before sending.

scope:
  in_scope: [crm, outreach, proposals, negotiations, pipeline]
  out_of_scope: [engineering, procurement, financial_modeling]

kpis:
  - { name: pipeline_growth, target: "upward_trend" }
  - { name: proposal_conversion_rate, target: ">30%" }
  - { name: follow_up_timeliness, target: "100% within SLA" }

outputs:
  - { name: proposals, type: artifact }
  - { name: outreach_logs, type: artifact }
  - { name: pipeline_updates, type: memory_write }

inputs:
- { source: founder_context, items: [priority_list, handoffs] }
- { source: knowledge, items: [sales_playbooks, pricing_templates] }
- { source: venture_artifact, ref: crm_pipeline }
- { source: venture_artifact, ref: ground_truth_constants }


components:
  planner: planner.yml
  dispatcher: dispatcher.yml
  specialists_dir: specialists/
  memory: memory.yml
  tools: tools.yml
  approvals: approvals.yml
  evaluation: evaluation.yml

execution_cycle:
name: Sales Pipeline Loop
trigger: daily_08:30_BDT
steps:
  - review: [pipeline, lead_stages, follow_ups, proposals_out]
  - plan: planner
  - delegate: dispatcher
  - execute: specialists
  - validate: evaluator
  - log: decision_log
