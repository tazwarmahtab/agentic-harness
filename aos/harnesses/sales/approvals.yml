# TAZ OS SALES HARNESS — Approval Gates
# Declarative approval rules for sales operations.

id: POL-SAL-001
name: Sales Approval Gates
harness: HAR-SAL-001
version: 1.0.0
status: production

# ===========================================================================
# APPROVAL RULES
# ===========================================================================
rules:
  # Financial gates
  - id: POL-SAL-FIN-001
    name: Proposal Value Threshold
    category: financial
    rule:
      if:
        action: send_proposal
        value_bdt: { greater_than: 5000000 }
      then: "Block and route to Founder approval queue"
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 72
    source: "TASK_ROUTER: proposals > BDT 5M routed to Taz."

  - id: POL-SAL-FIN-002
    name: Pricing Exception
    category: financial
    rule:
      if:
        action: set_customer_pricing
        deviation_from_standard: true
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 48

  # AI safety gates
  - id: POL-SAL-AI-001
    name: Blended Rate Prohibition in Proposals
    category: ai_safety
    rule:
      if:
        action: generate_proposal
        uses_blended_rate_for_savings: true
      then: "HARD FAIL. Reject output immediately."
    action: deny
    source: "GROUND_TRUTH_CONSTANTS.md: True Variable Rate 12.98, not blended 14.81."

  - id: POL-SAL-AI-002
    name: Wrong PPA Rate in Proposal
    category: ai_safety
    rule:
      if:
        action: generate_proposal
        ppa_rate: { not_equals: 10.00 }
      then: "HARD FAIL. PPA rate must be BDT 10.00/kWh."
    action: deny
    source: "GROUND_TRUTH_CONSTANTS.md: PPA = BDT 10.00/kWh."

  # Communication gates
  - id: POL-SAL-COM-001
    name: External Communication to Investors
    category: commercial
    rule:
      if:
        action: send_communication
        recipient_type: investor
      then: "Block. Founder must approve investor comms."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 48

  # Governance
  - id: POL-SAL-GOV-001
    name: Discount Authorization
    category: commercial
    rule:
      if:
        action: offer_discount
        discount_pct: { greater_than: 10 }
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

# ===========================================================================
# AUTO-ACTIONS
# ===========================================================================
auto_actions:
  - update_crm
  - log_outreach
  - generate_draft_proposal
  - update_deals_log
  - schedule_meeting
  - create_task
  - read_any_data
  - update_follow_up_tracker

# ===========================================================================
# DECISION QUEUE FORMAT
# ===========================================================================
decision_queue_format:
  bundled: true
  summary_per_decision:
    - action_description
    - financial_impact
    - risk_assessment
    - "recommended: approve_or_reject"
    - deadline_for_decision
  actions_available:
    - approve_all
    - review_individually
    - reject
  delivery: console_queue

# ===========================================================================
# DELEGATION
# ===========================================================================
delegation:
  enabled: true
  rule: "Delegation is explicit and temporary. No permanent privilege escalation."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
