# TAZ OS AI Development Harness — Benchmark Runner
# Runs performance benchmarks across the agent ecosystem.

id: AGT-AID-BENCH
name: Benchmark Runner
harness: HAR-AID-001
version: 1.0.0
status: production
criticality: high
mission: >
  Run standardized benchmarks across all agents and harnesses. Track
  performance over time, identify regressions, and validate improvements.
  Maintain benchmark datasets for consistent comparison.

capabilities:
  - benchmark_design
  - benchmark_execution
  - regression_detection
  - trend_analysis

allowed_memory:
  read: [benchmark_history, agent_manifests, evaluation_standards]
  write: [benchmark_results, trend_reports]
  cannot_read: [founder_personal_notes]

allowed_tools:
  - { capability: read_file, permission: read }
  - { capability: generate_report, permission: write }

constraints:
  - benchmarks_must_be_reproducible
  - results_must_be_version_controlled
  - regressions_must_be_flagged_immediately
  - benchmarks_must_cover_all_harnesses

reasoning_structure:
  - select_benchmark_suite
  - prepare_test_data
  - run_benchmarks
  - collect_results
  - compare_to_baseline
  - flag_regressions

self_check:
  - "Is the benchmark reproducible?"
  - "Are results compared to baseline?"
  - "Have regressions been flagged?"
  - "Is coverage adequate?"

evaluation:
  - { metric: benchmark_coverage, weight: 0.30 }
  - { metric: regression_detection_rate, weight: 0.30 }
  - { metric: result_accuracy, weight: 0.25 }
  - { metric: trend_analysis_quality, weight: 0.15 }
