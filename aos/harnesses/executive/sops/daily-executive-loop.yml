# SOP-002 — Daily Executive Loop (Morning Jarvis)
# Owner: AGT-EXEC-CHIEFOFSTAFF (composition) + all specialists
# Frequency: Daily, triggered at 09:00 BDT
# Purpose: The founder's morning brief + the daily execution cycle

id: SOP-EXEC-002
name: Daily Executive Loop
owner: AGT-EXEC-CHIEFOFSTAFF
version: 1.0.0
trigger: daily_09:00_BDT

# ===========================================================================
# PHASE 1 — GATHER (COO + Chief of Staff)
# ===========================================================================
phase_1_gather:
  owner: AGT-EXEC-COO + AGT-EXEC-CHIEFOFSTAFF
  actions:
    - read: dashboard, blockers, weekly_plan, backlog
    - read: calendar (today's events + conflicts)
    - read: email (unread, important threads)
    - read: crm (pipeline changes, idle leads >8d)
    - read: finance (cash position, receivables overdue, runway)
    - read: latest_session (overnight handoffs)

# ===========================================================================
# PHASE 2 — PLAN (Planner)
# ===========================================================================
phase_2_plan:
  owner: AGT-EXEC-PLAN
  actions:
    - apply_planner_prompt (see planner.yml)
    - produce: priority_list, delegation_plan, approval_requests
    - enforce: max 3 P0 active
    - calculate: estimated founder workload in minutes

# ===========================================================================
# PHASE 3 — RISK CHECK (Risk Officer)
# ===========================================================================
phase_3_risk_check:
  owner: AGT-EXEC-RSK
  actions:
    - scan_all_risk_categories
    - check: DSCR current, cash runway, regulatory deadlines, supplier status
    - produce: risk_assessment or escalation_alerts

# ===========================================================================
# PHASE 4 — PERFORMANCE SNAPSHOT (Performance Analyst)
# ===========================================================================
phase_4_performance:
  owner: AGT-EXEC-PERF
  actions:
    - scan KPIs for drift
    - check: pipeline idle leads, conversion rate trend, execution velocity
    - produce: kpi_drift_alerts (if any)

# ===========================================================================
# PHASE 5 — COMPOSE BRIEF (Chief of Staff)
# ===========================================================================
phase_5_compose:
  owner: AGT-EXEC-CHIEFOFSTAFF
  actions:
    - compose_daily_brief using:
        priorities: from phase_2
        risks: from phase_3
        performance: from phase_4
        calendar: from phase_1
        pending_approvals: from phase_2
    - bundle_decisions_for_approval_queue
    - produce: daily_brief (founder_only)
    - produce: approval_queue (founder_only)
    - produce: follow_up_reminders

# ===========================================================================
# PHASE 6 — DISPATCH (Dispatcher)
# ===========================================================================
phase_6_dispatch:
  owner: AGT-EXEC-DISPATCH
  actions:
    - route: delegation_plan items to correct specialists
    - write: handoff files for cross-harness dispatch
    - enforce: SLAs and escalation timers

# ===========================================================================
# PHASE 7 — FOUNDER REVIEW (Human)
# ===========================================================================
phase_7_founder_review:
  owner: HUM-000001
  actions:
    - read: daily_brief
    - act_on: approval_queue (approve_all / review_individually / reject)
    - provide: corrections, priorities, questions
    - output: founder_decisions → AGT-EXEC-CHIEFOFSTAFF logs to decision_log

# ===========================================================================
# PHASE 8 — EXECUTE + LOG (Specialists + COO)
# ===========================================================================
phase_8_execute_and_log:
  owner: AGT-EXEC-COO
  actions:
    - specialists execute approved tasks
    - update: DASHBOARD.md after every action
    - update: BLOCKERS.md if anything new stuck
    - log: decisions to decision_log
    - update: LATEST.md with session state

# ===========================================================================
# BRIEF FORMAT (what founder sees)
# ===========================================================================
brief_format: |
  Good morning.

  Today's priorities:
  1. [Highest-leverage item with one-line context]
  2. [Second priority with one-line context]
  3. [Third priority with one-line context]
  (Plus any overnight risk/performance flags)

  Recommended actions:
  - Approve [X]
  - Send [Y to Z]
  - Schedule [meeting about Q]

  Decisions pending: [N] items
  (Summary — expand in approval queue for detail)

  Estimated founder workload: [N] minutes

  Risks flagged: [any alerts]
  Cash runway: [X months]
  Pipeline idle leads: [N]

  [end brief]
