# SOP-004 — Weekly Review & Improvement Cycle
# Owner: AGT-EXEC-COO (execution) + AGT-EXEC-PERF (metrics)
# Frequency: Every Friday 17:00
# Source: ai_system/System/CHECK/REVIEW.md + ai_system/System/ACT/LESSONS.md
# Purpose: Compare planned vs actual, capture lessons, update benchmarks

id: SOP-EXEC-004
name: Weekly Review and Improvement Cycle
owner: AGT-EXEC-COO
version: 1.0.0
trigger: weekly_friday_17:00

# ===========================================================================
# PRINCIPLE
# ===========================================================================
principle: >
  If no review file exists for the week, the system has stopped.
  The weekly review is non-negotiable. It is the continuous improvement
  mechanism that prevents repeated failures.

# ===========================================================================
# PHASE 1 — GATHER WEEK DATA
# ===========================================================================
phase_1_gather:
  owner: AGT-EXEC-PERF
  actions:
    - collect: all completed tasks this week
    - collect: all p0_p1 items — planned vs actual
    - collect: specialist evaluation scores
    - collect: kpi_metrics vs targets
    - collect: escalation_events
    - collect: hard_fail_events
    - collect: approval_latency_times
    - collect: error_and_retry_counts

# ===========================================================================
# PHASE 2 — COMPARE PLANNED vs ACTUAL
# ===========================================================================
phase_2_compare:
  owner: AGT-EXEC-PERF
  actions:
    - map: each MONDAY priority → outcome (done / blocked / deferred / failed)
    - calculate: p0_completion_rate
    - calculate: deadline_hit_rate
    - calculate: decision_latency_avg
    - calculate: founder_time_saved_estimate
    - identify: largest variances (positive and negative)

# ===========================================================================
# PHASE 3 — IDENTIFY BOTTLENECKS & FAILURES
# ===========================================================================
phase_3_analyze:
  owner: AGT-EXEC-COO
  actions:
    - list: items that were blocked >24h (who held them?)
    - list: items that missed deadlines (why?)
    - list: hard_fails (what failed and why?)
    - list: repeated failure modes (pattern detection)
    - list: tools/providers with highest failure rate
    - assess: which specialist had most retries or escalations

# ===========================================================================
# PHASE 4 — WRITE REVIEW
# ===========================================================================
phase_4_write:
  owner: AGT-EXEC-PERF
  output_artifact: weekly_review  # ai_system/System/CHECK/REVIEW.md
  format: |
    # Weekly Review — [Date]

    ## Priorities (Monday → Friday)
    | Priority | Planned Outcome | Actual Outcome | Variance |
    |----------|----------------|----------------|---------|
    | P0-1     | ...            | ...            | ...     |
    | P0-2     | ...            | ...            | ...     |
    | P0-3     | ...            | ...            | ...     |

    ## KPIs This Week
    | KPI              | Target        | Actual        | Status |
    |------------------|---------------|---------------|--------|
    | P0 completion    | ≥1/week       | ...           | ...    |
    | Deadline hits    | 100%          | ...           | ...    |
    | Decision latency | <24h          | ...           | ...    |
    | Founder time     | >2hr/day      | ...           | ...    |

    ## Blockers Resolved
    - [Blocker] → [Resolution] → [Time held]

    ## Blockers Remaining
    - [Blocker] → [Holder] → [Since date]

    ## Risks Flagged
    - [Risk] → [Status] → [Action taken]

    ## Hard Fails
    - [What] → [Why] → [Agent] → [Fix]

    ## Lessons Learned
    - [Lesson 1]
    - [Lesson 2]

    ## Changes for Next Week
    - [Routing rule change]
    - [SOP update]
    - [Prompt improvement]
    - [Tool fix]

    ## Questions for Founder
    - [Q1]

# ===========================================================================
# PHASE 5 — UPDATE LESSONS
# ===========================================================================
phase_5_lessons:
  owner: AGT-EXEC-COO
  output_artifact: lessons  # ai_system/System/ACT/LESSONS.md
  actions:
    - append: new lessons from this week
    - check: are any previous lessons still being violated?
    - flag: repeated lessons (means the fix isn't working)

# ===========================================================================
# PHASE 6 — UPDATE ARTIFACTS
# ===========================================================================
phase_6_update:
  owner: AGT-EXEC-COO
  actions:
    - update: BACKLOG.md (remove completed, add discovered)
    - update: AGENTS_REGISTRY.md (status changes)
    - update: dispatcher.yml routing table (if routing rules changed)
    - update: planner.yml heuristics (if delegation patterns changed)
    - update: evaluation.yml benchmarks (if targets need adjustment)

# ===========================================================================
# PHASE 7 — SET NEXT WEEK
# ===========================================================================
phase_7_plan_next:
  owner: AGT-EXEC-COO + HUM-000001
  actions:
    - propose: next week's top 3 priorities from backlog
    - present: to founder for confirmation (Monday 09:00)
    - write: WEEKLY.md for next week
    - reset: DASHBOARD.md to new week state
