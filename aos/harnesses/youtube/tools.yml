# YouTube Content Harness — Tool Registry

id: TOL-YTU-001
name: YouTube Content Tools
harness: HAR-YTU-001
version: 1.0.0

tools:
  - id: TOOL-YTU-SCOUT
    name: scout_trending
    capability: scout_trending
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [youtube_search]
      write: []

  - id: TOOL-YTU-TRANSCRIPT
    name: fetch_transcript
    capability: fetch_transcript
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [youtube_transcript]
      write: []

  - id: TOOL-YTU-SCORE
    name: score_viral_potential
    capability: score_viral_potential
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [gemini_api]
      write: []

  - id: TOOL-YTU-STRATEGY
    name: generate_strategy
    capability: generate_strategy
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [gemini_api, memory]
      write: [content_plans]

  - id: TOOL-YTU-CROP
    name: crop_clip
    capability: crop_clip
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      read: [filesystem]
      write: [filesystem]

  - id: TOOL-YTU-CAPTION
    name: burn_captions
    capability: burn_captions
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      read: [filesystem]
      write: [filesystem]

  - id: TOOL-YTU-THUMBNAIL
    name: generate_thumbnail
    capability: generate_thumbnail
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      read: [higgsfield_api]
      write: [filesystem]

  - id: TOOL-YTU-UPLOAD
    name: upload_to_youtube
    capability: upload_to_youtube
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      read: [youtube_api]
      write: [youtube_api]

  - id: TOOL-YTU-READ
    name: read_memory
    capability: read_memory
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: []

  - id: TOOL-YTU-WRITE
    name: write_memory
    capability: write_memory
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [memory_store]
      write: [memory_store]

policy:
  require_approval_for_upload: true
  max_uploads_per_day: 3
  rate_limit_per_agent: "10 actions per cycle"
