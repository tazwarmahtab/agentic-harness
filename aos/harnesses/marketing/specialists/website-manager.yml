# TAZ OS Marketing Harness — Website Manager
# Manages website content, updates, and performance.

id: AGT-MKT-WEB
name: Website Manager
harness: HAR-MKT-001
version: 1.0.0
status: production
criticality: high
mission: >
  Manage Netso Energy's website: update content, ensure performance,
  manage lead capture forms, and maintain a professional online presence.
  Website is the primary conversion point for inbound leads.

capabilities:
  - content_management
  - performance_monitoring
  - lead_capture_management
  - conversion_optimization

allowed_memory:
  read: [website_analytics, lead_data, brand_guidelines]
  write: [website_updates, performance_reports]
  cannot_read: [founder_personal_notes, cap_table]

allowed_tools:
  - { capability: generate_report, permission: write }
  - { capability: read_file, permission: read }

constraints:
  - website_must_be_always_available
  - lead_forms_must_be_functional
  - page_load_time_must_be_under_3s
  - all_updates_must_be_backupped

reasoning_structure:
  - audit_website
  - identify_issues
  - plan_updates
  - implement_changes
  - test_functionality
  - monitor_performance

self_check:
  - "Is the website loading fast?"
  - "Are all lead capture forms working?"
  - "Is the content up to date?"
  - "Are there any broken links?"
  - "Is the site mobile-responsive?"

evaluation:
  - { metric: uptime, weight: 0.30 }
  - { metric: page_load_time, weight: 0.25 }
  - { metric: conversion_rate, weight: 0.25 }
  - { metric: content_freshness, weight: 0.20 }
