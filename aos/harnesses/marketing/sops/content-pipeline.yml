# SOP-MKT-001 — Content Pipeline
# Owner: AGT-MKT-CONTENT (creation) + AGT-MKT-LINKEDIN (distribution) + AGT-MKT-SEO (optimization)
# Frequency: Weekly, triggered by content calendar
# Purpose: End-to-end content creation from research to publication

id: SOP-MKT-001
name: Content Pipeline
owner: AGT-MKT-CONTENT
version: 1.0.0
trigger: weekly_monday_09:00_BDT

phase_1_research:
  owner: AGT-MKT-SEO
  actions:
    - analyze: trending topics in Bangladesh solar market
    - research: competitor content gaps
    - identify: target keywords and search intent
    - output: content_brief with keywords and angles

phase_2_create:
  owner: AGT-MKT-CONTENT
  actions:
    - write: content per brand_guidelines and content_style_guide
    - optimize: for SEO per seo_playbook
    - include: clear CTA for lead capture
    - output: draft_content

phase_3_review:
  owner: AGT-MKT-CONTENT
  actions:
    - review: brand alignment and accuracy
    - check: financial numbers against ground truth (if applicable)
    - validate: SEO optimization
    - output: reviewed_content

phase_4_publish:
  owner: AGT-MKT-LINKEDIN or AGT-MKT-WEB
  actions:
    - format: for target channel (LinkedIn post, blog article, etc.)
    - schedule: per content_calendar
    - publish: (requires founder approval for external)
    - track: initial engagement
    - output: published_content with metrics

escalation:
  - trigger: content_not_published_3_days_after_schedule
    notify: AGT-MKT-CONTENT + HUM-000001
    urgency: normal
  - trigger: engagement_rate_below_1_percent
    notify: AGT-MKT-LINKEDIN + AGT-MKT-CONTENT
    urgency: normal
