# TAZ OS Marketing Harness
# Manages demand generation: content, LinkedIn, SEO, website, brand.

id: HAR-MKT-001
name: Marketing Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
criticality: medium
mission: >
  Generate demand for Netso Energy through content marketing, LinkedIn
  thought leadership, SEO optimization, and website management. Build
  brand authority in the Bangladesh rooftop solar market.

scope:
  in_scope: [content_creation, linkedin, seo, website, brand_management]
  out_of_scope: [sales_outreach, financial_modeling, engineering]

kpis:
  - { name: content_output_per_week, target: "3+ pieces" }
  - { name: linkedin_engagement_rate, target: ">5%" }
  - { name: organic_traffic_growth, target: ">10% month-over-month" }
  - { name: lead_generation_from_content, target: ">5 qualified leads/month" }

outputs:
  - { name: content_pieces, type: artifact }
  - { name: linkedin_posts, type: artifact }
  - { name: seo_reports, type: artifact }

inputs:
- { source: founder_context, items: [priority_list, handoffs] }
- { source: knowledge, items: [brand_guidelines, content_calendar] }


components:
  planner: planner.yml
  dispatcher: dispatcher.yml
  specialists_dir: specialists/
  memory: memory.yml
  tools: tools.yml
  approvals: approvals.yml
  evaluation: evaluation.yml
ame: Marketing Loop
trigger: weekly_monday_08:00_BDT
steps:
  - action: review
    target: [content_calendar, linkedin_analytics, seo_reports, lead_pipeline]
  - action: plan
    target: planner
  - action: delegate
    target: dispatcher
  - action: execute
    target: specialists
  - action: evaluate
    target: evaluation
  - action: log
    target: decision_log
name: Marketing Loop
trigger: weekly_monday_08:00_BDT
steps:
  - review: [content_calendar, linkedin_analytics, seo_reports, lead_pipeline]
  - plan: planner
  - delegate: dispatcher
  - execute: specialists
  - evaluate: evaluation
  - log: decision_log

execution_cycle:
  name: Marketing Loop
  trigger: weekly_monday_08:00_BDT
  steps:
    - action: review
      target: [content_calendar, linkedin_analytics, seo_reports, lead_pipeline]
    - action: plan
      target: planner
    - action: delegate
      target: dispatcher
    - action: execute
      target: specialists
    - action: evaluate
      target: evaluation
    - action: log
      target: decision_log
