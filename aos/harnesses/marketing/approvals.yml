# TAZ OS MARKETING HARNESS — Approval Gates

id: POL-MKT-001
name: Marketing Approval Gates
harness: HAR-MKT-001
version: 1.0.0
status: production

rules:
  - id: POL-MKT-MKT-001
    name: External Content Publish
    category: commercial
    rule:
      if:
        action: publish_content
        channel: external
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

  - id: POL-MKT-MKT-002
    name: Brand Guideline Deviation
    category: commercial
    rule:
      if:
        action: create_content
        deviation_from_brand: true
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

  - id: POL-MKT-MKT-003
    name: Website Changes
    category: engineering
    rule:
      if:
        action: modify_website
      then: "Routes to Founder for review."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

auto_actions:
  - draft_content
  - analyze_seo
  - track_metrics
  - update_content_calendar
  - read_performance_data
  - generate_seo_report

decision_queue_format:
  bundled: true
  summary_per_decision:
    - action_description
    - risk_assessment
  actions_available: [approve_all, review_individually, reject]
  delivery: console_queue

delegation:
  enabled: true
  rule: "Delegation is explicit and temporary."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
