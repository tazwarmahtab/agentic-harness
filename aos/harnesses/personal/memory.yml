# TAZ OS PERSONAL HARNESS — Shared Memory

id: MEM-PER-001
name: Personal Harness Shared Memory
harness: HAR-PER-001
version: 1.0.0

layers:
  long_term:
    goals:
      description: "Quarterly and annual goals with progress tracking"
      classification: founder_only
    habits:
      description: "Tracked habits with streaks and completion rates"
      classification: founder_only
    health_baseline:
      description: "Exercise routines, sleep targets, nutrition goals"
      classification: founder_only
    reading_list:
      description: "Books, articles, and learning materials with status"
      classification: founder_only

  episodic:
    calendar_events:
      description: "Scheduled meetings, deadlines, travel"
      write_access: [AGT-PER-CAL]
      classification: founder_only
    task_log:
      description: "Daily task completions and productivity metrics"
      write_access: [AGT-PER-TASK]
      classification: founder_only
    health_log:
      description: "Exercise, sleep, nutrition entries"
      write_access: [AGT-PER-HEALTH]
      classification: founder_only
    reading_progress:
      description: "Current reading status and notes"
      write_access: [AGT-PER-READ]
      classification: founder_only

  semantic:
    productivity_rules:
      description: "Deep work protocols, focus techniques, time management"
      classification: founder_only
    health_protocols:
      description: "Exercise plans, sleep hygiene, nutrition guidelines"
      classification: founder_only
    goal_framework:
      description: "OKR methodology, quarterly review process"
      classification: founder_only

permissions:
  AGT-PER-CAL:
    read: [calendar_events, goals]
    write: [calendar_events]
    cannot_read: [health_log, reading_progress]

  AGT-PER-GOAL:
    read: [goals, task_log]
    write: [goals]
    cannot_read: [health_log]

  AGT-PER-HABIT:
    read: [habits, health_log]
    write: [habits]
    cannot_read: [calendar_events]

  AGT-PER-HEALTH:
    read: [health_baseline, health_log]
    write: [health_log]
    cannot_read: [goals, task_log]

  AGT-PER-READ:
    read: [reading_list, reading_progress]
    write: [reading_progress]
    cannot_read: [health_log, calendar_events]

  AGT-PER-TASK:
    read: [goals, task_log, calendar_events]
    write: [task_log]
    cannot_read: [health_log]

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution."
  audit: "every memory write creates immutable audit record"
