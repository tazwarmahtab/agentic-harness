# TAZ OS PERSONAL HARNESS — Tools

id: TOL-PER-001
name: Personal Harness Tool Registry
harness: HAR-PER-001
version: 1.0.0

tools:
  - id: TOL-PER-001
    name: Calendar Service
    capability: read_calendar
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-PER-CAL]
    inputs:
      required: []
      optional: [date_range, attendee]
    outputs: [events, conflicts]

  - id: TOL-PER-002
    name: Task Manager
    capability: manage_tasks
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-PER-TASK]
    inputs:
      required: [task_description]
      optional: [priority, deadline, category]
    outputs: [task_id, status]

  - id: TOL-PER-003
    name: Document Generator
    capability: generate_document
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-PER-GOAL, AGT-PER-TASK, AGT-PER-READ]
    inputs:
      required: [template, content]
    outputs: [document_path, status]

  - id: TOL-PER-004
    name: Memory Writer
    capability: write_memory
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [per memory.yml permissions]
    inputs:
      required: [memory_key, content, classification]
    outputs: [status]

compositions:
  - name: daily_planning
    steps:
      - capability: read_calendar
      - capability: manage_tasks
      - capability: generate_document
    owner: AGT-PER-TASK

providers:
  calendar:
    preferred: null
    fallback: [manual]
