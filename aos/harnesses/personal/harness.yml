# TAZ OS Personal Harness
# Founder's personal productivity: calendar, tasks, health, habits, goals.

id: HAR-PER-001
name: Personal Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
criticality: low
mission: >
  Keep the founder organized, healthy, and focused. Manage calendar,
  track tasks, monitor health habits, maintain reading list, and
  ensure personal goals stay on track alongside company objectives.

scope:
  in_scope: [calendar, tasks, health, habits, reading, goals, networking]
  out_of_scope: [company_operations, financial_modeling, engineering]

kpis:
  - { name: daily_habit_completion, target: ">80%" }
  - { name: task_completion_rate, target: ">90%" }
  - { name: reading_minutes_per_week, target: ">120 min" }
  - { name: exercise_sessions_per_week, target: ">4" }
  - { name: goal_progress, target: "on_track" }

outputs:
  - { name: daily_brief, type: artifact }
  - { name: habit_tracker, type: artifact }
  - { name: goal_progress, type: artifact }

inputs:
- { source: founder_context, items: [priority_list, handoffs] }
- { source: knowledge, items: [personal_goals, habit_templates] }
- { source: calendar, items: [events, meetings, reminders] }


components:
  planner: planner.yml
  dispatcher: dispatcher.yml
  specialists_dir: specialists/
  memory: memory.yml
  tools: tools.yml
  approvals: approvals.yml
  evaluation: evaluation.yml
ame: Personal Productivity Loop
trigger: daily_06:00_BDT
steps:
  - action: review
    target: [calendar, tasks, health_metrics, goals]
  - action: plan
    target: planner
  - action: execute
    target: specialists
  - action: log
    target: decision_log
name: Personal Productivity Loop
trigger: daily_06:00_BDT
steps:
  - review: [calendar, tasks, health_metrics, goals]
  - plan: planner
  - execute: specialists
  - log: decision_log

execution_cycle:
  name: Personal Productivity Loop
  trigger: daily_06:00_BDT
  steps:
    - action: review
      target: [calendar, tasks, health_metrics, goals]
    - action: plan
      target: planner
    - action: execute
      target: specialists
    - action: log
      target: decision_log
