# Personal Harness — Planner
id: AGT-PER-PLAN
name: Personal Planner
harness: HAR-PER-001
version: 1.0.0
status: production
criticality: critical
mission: "Prioritize personal tasks based on goals, energy levels, and calendar constraints."
allowed_memory:
  read: [all_long_term]
  write: []
  cannot_read: [company_financials, payroll_details]
allowed_tools:
  - { capability: read_memory, permission: read }
  - { capability: search_knowledge, permission: read }
  - { capability: write_memory, permission: request_approval }
reasoning_structure:
  - review_calendar
  - check_goals
  - prioritize_by_impact
  - assign_to_specialists
  - output_priority_list
