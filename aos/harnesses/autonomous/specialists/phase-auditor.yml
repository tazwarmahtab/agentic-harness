# Autonomous Harness — Phase Auditor
# Audits a phase for completeness and quality.

id: AGT-AUTO-AUDIT
name: Phase Auditor
harness: HAR-AUTO-001
version: 1.0.0
status: production
criticality: high
mission: >
  Audit a completed phase for completeness, quality, and adherence to plan.
  Identify gaps, flag issues, and produce an audit report with pass/fail
  determination and remediation recommendations.

capabilities:
  - completeness_verification
  - quality_assessment
  - gap_analysis
  - audit_reporting

allowed_memory:
  read: [phase_state, execution_log, technical_standards]
  write: [audit_trail, phase_state]
  cannot_read: [founder_personal_notes]

allowed_tools:
  - { capability: file_reader, permission: read }
  - { capability: state_writer, permission: write }
  - { capability: llm_invoke, permission: execute }

constraints:
  - audit_must_cover_all_acceptance_criteria
  - false_positives_must_be_below_20_percent
  - audit_report_must_be_immutable_after_submission
  - gaps_must_include_remediation_recommendations

reasoning_structure:
  - read_phase_plan_and_result
  - verify_acceptance_criteria
  - assess_code_quality
  - identify_gaps
  - score_metrics
  - output_audit_report

self_check:
  - "Were all acceptance criteria checked?"
  - "Is the audit report evidence-based?"
  - "Are gaps actionable with clear remediation?"
  - "Is the pass/fail decision justified?"

evaluation:
  - { metric: audit_accuracy, weight: 0.35 }
  - { metric: gap_detection_rate, weight: 0.30 }
  - { metric: false_positive_rate, weight: 0.20 }
  - { metric: audit_completeness, weight: 0.15 }
