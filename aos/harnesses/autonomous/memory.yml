# Autonomous Harness — Shared Memory
id: MEM-AUTO-001
name: Autonomous Harness Shared Memory
harness: HAR-AUTO-001
version: 1.0.0

layers:
  long_term:
    milestone_roadmap:
      description: "Milestone definitions, phase breakdowns, dependency maps"
      classification: internal
    technical_standards:
      description: "Coding conventions, architecture patterns, quality bar"
      classification: internal

  episodic:
    phase_state:
      description: "Current phase status, progress, blockers per milestone"
      write_access: [AGT-AUTO-EXEC, AGT-AUTO-AUDIT]
      classification: internal
    execution_log:
      description: "Decisions made, actions taken, outcomes per phase"
      write_access: [AGT-AUTO-EXEC, AGT-AUTO-DISPATCH]
      classification: internal
    audit_trail:
      description: "Audit results, pass/fail records, remediation tracking"
      write_access: [AGT-AUTO-AUDIT]
      classification: internal

  semantic:
    phase_templates:
      description: "Reusable phase patterns and execution templates"
      classification: internal
    dependency_rules:
      description: "Phase ordering rules, blocking dependencies"
      classification: internal

permissions:
  AGT-AUTO-PLAN:
    read: [milestone_roadmap, technical_standards, phase_state]
    write: [phase_state]
    cannot_read: []

  AGT-AUTO-DISPATCH:
    read: [milestone_roadmap, phase_state, execution_log]
    write: [execution_log]
    cannot_read: []

  AGT-AUTO-EXEC:
    read: [milestone_roadmap, technical_standards, phase_templates]
    write: [execution_log, phase_state]
    cannot_read: []

  AGT-AUTO-AUDIT:
    read: [phase_state, execution_log, technical_standards]
    write: [audit_trail, phase_state]
    cannot_read: []

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution."
  audit: "every memory write creates immutable audit record"
