# TAZ OS SOFTWARE DEV HARNESS — Shared Memory

id: MEM-DEV-001
name: Software Dev Harness Shared Memory
harness: HAR-DEV-001
version: 1.0.0

layers:
  long_term:
    product_roadmap:
      description: "Feature priorities, sprint goals, release plan"
      classification: internal
    codebase_docs:
      description: "Architecture docs, API references, runbooks"
      classification: internal
    tech_stack:
      description: "Languages, frameworks, tools, deployment infrastructure"
      classification: internal

  episodic:
    sprint_log:
      description: "Sprint progress, completed features, blockers"
      write_access: [AGT-DEV-PM]
      classification: internal
    prd_log:
      description: "PRD versions, review status, implementation tracking"
      write_access: [AGT-DEV-PRD]
      classification: internal
    release_log:
      description: "Release history, rollback records, incident postmortems"
      write_access: [AGT-DEV-REL]
      classification: internal
    test_results:
      description: "Test runs, coverage reports, flaky test tracking"
      write_access: [AGT-DEV-TEST]
      classification: internal

  semantic:
    coding_standards:
      description: "Style guides, patterns, anti-patterns, review checklists"
      classification: internal
    deployment_playbook:
      description: "CI/CD process, rollback procedures, feature flags"
      classification: internal
    testing_strategy:
      description: "Test pyramid, coverage targets, E2E vs unit strategy"
      classification: internal
    prd_template:
      description: "Standard PRD format with required sections"
      classification: internal

permissions:
  AGT-DEV-PM:
    read: [product_roadmap, sprint_log, tech_stack]
    write: [sprint_log]
    cannot_read: [raw_financial_models]

  AGT-DEV-PRD:
    read: [product_roadmap, prd_log, coding_standards]
    write: [prd_log]
    cannot_read: [release_log]

  AGT-DEV-UI:
    read: [product_roadmap, prd_log, coding_standards]
    write: []
    cannot_read: []

  AGT-DEV-TEST:
    read: [test_results, tech_stack, testing_strategy]
    write: [test_results]
    cannot_read: []

  AGT-DEV-DOC:
    read: [codebase_docs, tech_stack, coding_standards]
    write: [codebase_docs]
    cannot_read: []

  AGT-DEV-REL:
    read: [release_log, tech_stack, deployment_playbook, sprint_log]
    write: [release_log]
    cannot_read: []

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution."
  audit: "every memory write creates immutable audit record"
