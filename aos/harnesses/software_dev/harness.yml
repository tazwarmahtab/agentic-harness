# TAZ OS Software Development Harness
# Manages software development for Netso's internal tools.

id: HAR-DEV-001
name: Software Development Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
criticality: medium
mission: >
  Manage software development: product management, PRD writing, UI review,
  backend planning, frontend planning, testing, documentation, GitHub
  review, and release management for Netso's internal tools.

scope:
  in_scope: [product_management, prd_writing, ui_review, backend_planning, testing, documentation, github, releases]
  out_of_scope: [company_operations, financial_modeling, customer_facing]

kpis:
  - { name: sprint_velocity, target: "on_track" }
  - { name: bug_count, target: "downward_trend" }
  - { name: test_coverage, target: ">80%" }
  - { name: deployment_frequency, target: "weekly" }

outputs:
  - { name: prd_documents, type: artifact }
  - { name: code_reviews, type: artifact }
  - { name: test_reports, type: artifact }

inputs:
- { source: founder_context, items: [priority_list, handoffs] }
- { source: knowledge, items: [technical_standards, coding_conventions] }
- { source: projects, items: [product_backlog, release_plan] }


components:
  planner: planner.yml
  dispatcher: dispatcher.yml
  specialists_dir: specialists/
  memory: memory.yml
  tools: tools.yml
  approvals: approvals.yml
  evaluation: evaluation.yml
ame: Software Development Loop
trigger: event_driven
steps:
  - action: review
    target: [product_backlog, code_reviews, deployment_status]
  - action: plan
    target: planner
  - action: delegate
    target: dispatcher
  - action: execute
    target: specialists
  - action: review
    target: evaluation
  - action: log
    target: decision_log
name: Software Development Loop
trigger: event_driven
steps:
  - review: [product_backlog, code_reviews, deployment_status]
  - plan: planner
  - delegate: dispatcher
  - execute: specialists
  - review: evaluation
  - log: decision_log

execution_cycle:
  name: Software Development Loop
  trigger: event_driven
  steps:
    - action: review
      target: [product_backlog, code_reviews, deployment_status]
    - action: plan
      target: planner
    - action: delegate
      target: dispatcher
    - action: execute
      target: specialists
    - action: review
      target: evaluation
    - action: log
      target: decision_log
