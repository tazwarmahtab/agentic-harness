# TAZ OS LEGAL HARNESS — Tools

id: TOL-LEG-001
name: Legal Harness Tool Registry
harness: HAR-LEG-001
version: 1.0.0

tools:
  - id: TOL-LEG-001
    name: Document Generator
    capability: generate_document
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-LEG-NDA, AGT-LEG-LOI, AGT-LEG-PPA, AGT-LEG-REV]
    inputs:
      required: [template, content]
      optional: [format, output_path]
    outputs: [document_path, status]

  - id: TOL-LEG-002
    name: Contract Reader
    capability: read_contract
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-LEG-REV, AGT-LEG-PPA, AGT-LEG-LOI]
    inputs:
      required: [contract_path]
    outputs: [content, metadata]

  - id: TOL-LEG-003
    name: Regulatory Calendar
    capability: read_regulatory_calendar
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-LEG-COMP]
    inputs:
      required: []
      optional: [filing_type, deadline_range]
    outputs: [upcoming_filings, status]

  - id: TOL-LEG-004
    name: Approval Request
    capability: request_approval
    category: governance
    version: 1.0.0
    status: registered
    permissions:
      execute: [AGT-LEG-NDA, AGT-LEG-LOI, AGT-LEG-PPA, AGT-LEG-REV, AGT-LEG-COMP]
    inputs:
      required: [action, rationale, risk_assessment]
    outputs: [approval_id, status, queue_position]

  - id: TOL-LEG-005
    name: Memory Writer
    capability: write_memory
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [per memory.yml permissions]
    inputs:
      required: [memory_key, content, classification]
    outputs: [status]

compositions:
  - name: contract_lifecycle
    steps:
      - capability: generate_document
      - capability: read_contract       # review
      - capability: request_approval    # founder gate
    owner: Legal Harness (dispatched to)

providers:
  document_storage:
    preferred: null
    fallback: [local]
  legal_database:
    preferred: null
    fallback: [manual]
