# SOP-LEG-001 — Contract Lifecycle
# Owner: AGT-LEG-REV (review) + specialized agents per document type
# Frequency: Realtime, triggered by cross-harness dispatch
# Purpose: End-to-end contract process from draft to execution

id: SOP-LEG-001
name: Contract Lifecycle
owner: AGT-LEG-REV
version: 1.0.0
trigger: realtime

phase_1_draft:
  owner: AGT-LEG-NDA or AGT-LEG-LOI or AGT-LEG-PPA (depending on type)
  actions:
    - read: contract_templates for document type
    - read: ground_truth_constants for financial terms
    - generate: draft using approved template
    - validate: financial numbers against ground truth
    - output: draft_contract

phase_2_review:
  owner: AGT-LEG-REV
  actions:
    - read: draft_contract
    - redline: against standard positions
    - check: bilateral symmetry (NDA), rate accuracy (PPA), completeness
    - flag: any deviations from standard terms
    - output: reviewed_contract with redlines

phase_3_approve:
  owner: HUM-000001
  actions:
    - review: reviewed_contract
    - approve: or request changes
    - output: approved_contract

phase_4_execute:
  owner: AGT-LEG-REV
  actions:
    - finalize: approved_contract
    - route: for signature (founder only)
    - store: executed contract in memory
    - update: contract log
    - output: executed_contract

escalation:
  - trigger: contract_review_pending_48h
    notify: AGT-LEG-REV + HUM-000001
    urgency: high
  - trigger: regulatory_deadline_7_days
    notify: AGT-LEG-COMP + HUM-000001
    urgency: immediate
