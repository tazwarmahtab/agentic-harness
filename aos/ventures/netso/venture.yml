# ---------------------------------------------------------------------------
# Live source-of-truth artifacts (relative to aos/ventures/ root).
# Harness memory.yml references these by key. Paths are canonical.
# ---------------------------------------------------------------------------
artifacts:
  # Financial ground truth — NEVER deviate. All numbers must match this.
  ground_truth_constants:
    path: netso/seed/constants.json
    classification: confidential
    rule: "Any financial metric in any output MUST match this file."

  # Executive / operations memory (the PLAN/DO/CHECK/ACT loop)
  dashboard:
    path: netso/DASHBOARD.md
    role: "Single source of truth — live state. Read first every session."
    classification: internal
  weekly_plan:
    path: netso/PLAN/WEEKLY.md
    role: "Top 3 priorities for current week."
    classification: internal
  backlog:
    path: netso/PLAN/BACKLOG.md
    role: "All known work, prioritized."
    classification: internal
  blockers:
    path: netso/ACT/BLOCKERS.md
    role: "Active blockers, each naming a holder."
    classification: internal
  lessons:
    path: netso/ACT/LESSONS.md
    role: "Patterns learned, mistakes to avoid."
    classification: internal
  weekly_review:
    path: netso/CHECK/REVIEW.md
    role: "Friday review — what worked, what didn't."
    classification: internal
  latest_session:
    path: netso/LOGS/LATEST.md
    role: "Current session context. Read at startup, update at shutdown."
    classification: internal
  handoffs:
    path: netso/LOGS/handoffs/
    role: "Inter-harness handoff channel."
    classification: internal

  # Dispatch sources
  agents_registry:
    path: netso/AGENTS_REGISTRY.md
    role: "Master roster of all Netso agents."
    classification: internal
  task_router:
    path: netso/TASK_ROUTER.md
    role: "Routing rules + SLAs + escalation. Dispatcher's source table."
    classification: internal

  # Persona files
  personas_dir:
    path: netso/personas/
    role: "Source personas for re-homed specialists."

# ---------------------------------------------------------------------------
# Financial constants embedded for machine-readable validation.
# These mirror GROUND_TRUTH_CONSTANTS.md. If they drift, core_economics.py
# is the canonical source.
# ---------------------------------------------------------------------------
financial_constants:
  capex_per_kw_scenario_a: 55000     # BDT — baseline
  capex_per_kw_scenario_b: 40000     # BDT — policy upside (0% duty, conditional)
  capex_default_scenario: A           # ALWAYS A for external docs unless NBR confirms B
  true_variable_rate: 12.98           # BDT/kWh (MT-2, excl. fixed demand charge)
  blended_rate: 14.81                 # BDT/kWh — NEVER use for savings calc
  ppa_rate: 10.00                     # BDT/kWh (3% triennial escalation)
  customer_savings_pct: 23.0          # vs True Variable
  nem_export_rate: 6.4523             # BDT/kWh
  idcol_debt_pct: 80
  idcol_interest: 6.0                 # % p.a.
  idcol_term_years: 10
  dscr_scenario_a: 2.25               # escalation threshold
  dscr_scenario_b: 3.09
  dscr_alert_floor: 2.0               # immediate alert below this
  capacity_factor: 16.5               # % (Chattogram)
  opex_per_kw: 1000                   # BDT/kW

# ---------------------------------------------------------------------------
# Approval thresholds for this venture (referenced by approvals.yml)
# ---------------------------------------------------------------------------
approval_thresholds:
  proposal_value_bdt: 5000000         # > this → founder approval
  dscr_escalation_floor: 2.25         # < this → founder + CFO
  dscr_alert_floor: 2.0               # < this → immediate alert