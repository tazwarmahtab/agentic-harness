<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS Dashboard — Live Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #preview-root { height: 100%; }
</style>

<!--
  Static importmap — MUST be declared before any <script type="module">.
  Browsers resolve all relative specifiers to absolute URLs before matching,
  so a single key relative to this file's location covers every depth of
  import (../../services/api.js, ../services/api.js, ./services/api.js all
  resolve to the same absolute URL as ./services/api.js here).
-->
<script type="importmap">
{
  "imports": {
    "./services/api.js": "./preview-api.js",
    "./stores/dashboard.js": "./preview-store.js"
  }
}
</script>
</head>
<body>
<div id="preview-root"></div>

<script type="module">
  import { openPanel } from './index.js';

  try {
    openPanel();
  } catch (e) {
    console.error('Dashboard load error:', e);
    document.getElementById('preview-root').innerHTML =
      `<div style="padding:40px;color:red;font-family:monospace;">
        <h2>Dashboard load error</h2>
        <pre>${e.message}\n${e.stack ?? ''}</pre>
        <p>Make sure the AOS engine is running on port 7001.</p>
      </div>`;
  }
</script>
</body>
</html>
