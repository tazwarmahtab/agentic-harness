<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder OS — AOS</title>
  <link rel="stylesheet" href="/static/dashboard.css">

  <style>html,body{margin:0;min-height:100%;background:#0D1117;color:#E6EDF3}label{display:block;margin:12px 0 4px}input,textarea,select{box-sizing:border-box;max-width:100%;padding:10px;background:#161B22;color:#E6EDF3;border:1px solid #30363D;border-radius:4px}textarea{width:100%;min-height:110px}.prospect-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,2fr);gap:24px}.prospect-panel{min-width:0;padding:16px;border:1px solid #30363D;border-radius:6px}.prospect-panel pre{white-space:pre-wrap;overflow-wrap:anywhere}.prospect-panel button{margin:4px}.prospect-panel blockquote{margin:12px 0;padding:8px;border-left:2px solid #10B981;overflow-wrap:anywhere}@media(max-width:800px){.prospect-grid{grid-template-columns:1fr}}</style>
</head>

  <script type="module">import {openPanel} from '/static/index.js';openPanel();</script>
