# Netso Energy Paperclip runtime configuration.
#
# SECURITY: import/run this package only on a patched Paperclip release.
# Keep company import restricted to trusted operators and keep agents paused
# until the shadow-mode validation gate passes.
#
# DEPLOYMENT: replace /opt/netso/agentic-harness with the actual checked-out
# repository path before activating agents.

agents:
  ceo:
    adapter:
      type: process
      config:
        command: python3
        args: ["-m", "aos.paperclip_agent"]
        cwd: /opt/netso/agentic-harness
        timeoutSec: 900
        graceSec: 20
        env:
          AOS_PROJECT_ROOT: /opt/netso/agentic-harness
          NETSO_AOS_AGENT_ID: AGT-EXEC-CEO
          PAPERCLIP_AGENT_SLUG: ceo
    budgetMonthlyCents: 50000

