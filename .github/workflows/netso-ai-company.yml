name: Netso AI Company validation

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-netso-company:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Netso Agent Companies package
        run: python scripts/validate_netso_company.py

      - name: Run Paperclip bridge tests
        run: pytest tests/test_paperclip_integration.py -q
