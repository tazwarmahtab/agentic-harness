name: Netso AI Company validation

on:
  pull_request:
    branches: [main, master]
    paths:
      - companies/netso-energy/**
      - scripts/validate_netso_company.py
      - tests/test_paperclip_integration.py
      - tests/test_paperclip_agent.py
      - tests/test_netso_customer.py
      - aos/integrations/paperclip.py
      - aos/integrations/paperclip_runtime.py
      - aos/paperclip_agent.py
      - aos/ventures/netso/**
      - aos/harnesses/external/netso_legacy/**
      - aos/services/netso_customer.py
      - pyproject.toml
      - uv.lock
      - '.github/workflows/netso-ai-company.yml'
  workflow_dispatch:

jobs:
  validate-netso-company:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Netso Agent Companies package
        run: python scripts/validate_netso_company.py

      - name: Run Paperclip bridge tests
        run: pytest tests/test_paperclip_integration.py -q
