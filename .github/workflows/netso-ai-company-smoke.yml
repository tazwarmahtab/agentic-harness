name: Netso AI Company smoke

'on':
  push:
    branches:
      - 'feat/netso-ai-company-v1'
    paths:
      - companies/netso-energy/**
      - scripts/validate_netso_company.py
      - tests/test_paperclip_integration.py
      - tests/test_paperclip_agent.py
      - tests/test_netso_customer.py
      - aos/integrations/paperclip.py
      - aos/integrations/paperclip_runtime.py
      - aos/paperclip_agent.py
      - aos/ventures/netso/**
      - aos/harnesses/external/netso_legacy/**
      - aos/services/netso_customer.py
      - pyproject.toml
      - uv.lock
      - '.github/workflows/netso-ai-company-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - companies/netso-energy/**
      - scripts/validate_netso_company.py
      - tests/test_paperclip_integration.py
      - tests/test_paperclip_agent.py
      - tests/test_netso_customer.py
      - aos/integrations/paperclip.py
      - aos/integrations/paperclip_runtime.py
      - aos/paperclip_agent.py
      - aos/ventures/netso/**
      - aos/harnesses/external/netso_legacy/**
      - aos/services/netso_customer.py
      - pyproject.toml
      - uv.lock
      - '.github/workflows/netso-ai-company-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile AOS Python sources
        run: python -m compileall -q aos
      - name: Validate company package
        run: python scripts/validate_netso_company.py
      - name: Validate Paperclip config syntax
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          p = pathlib.Path('companies/netso-energy/.paperclip.yaml')
          data = yaml.safe_load(p.read_text())
          assert set(data['agents']) == {'ceo','cfo','coo','cro','cto','legal'}
          print('Paperclip config: OK')
          PY
