# TAZ OS MARKETING HARNESS — Evaluation Metrics

id: EVAL-MKT-001
name: Marketing Harness Evaluation Framework
harness: HAR-MKT-001
version: 1.0.0

harness_metrics:
  - name: content_output_per_week
    target: "3+ pieces"
    frequency: weekly
    owner: AGT-MKT-CONTENT
    measurement: content_pieces_published

  - name: linkedin_engagement_rate
    target: ">5%"
    frequency: weekly
    owner: AGT-MKT-LINKEDIN
    measurement: engagement_divided_by_impressions

  - name: organic_traffic_growth
    target: ">10% month-over-month"
    frequency: monthly
    owner: AGT-MKT-SEO
    measurement: organic_sessions_change

  - name: lead_generation_from_content
    target: ">5 qualified leads/month"
    frequency: monthly
    owner: AGT-MKT-CONTENT
    measurement: leads_attributed_to_content

specialist_metrics:
  AGT-MKT-CONTENT:
    - content_quality: { weight: 0.30 }
    - brand_alignment: { weight: 0.25 }
    - seo_optimization: { weight: 0.20 }
    - output_volume: { weight: 0.15 }
    - lead_generation: { weight: 0.10 }

  AGT-MKT-LINKEDIN:
    - engagement_rate: { weight: 0.30 }
    - follower_growth: { weight: 0.20 }
    - content_relevance: { weight: 0.25 }
    - posting_consistency: { weight: 0.15 }
    - lead_generation: { weight: 0.10 }

  AGT-MKT-SEO:
    - keyword_ranking_improvement: { weight: 0.30 }
    - organic_traffic_growth: { weight: 0.25 }
    - technical_seo_score: { weight: 0.25 }
    - backlink_quality: { weight: 0.20 }

  AGT-MKT-WEB:
    - conversion_rate: { weight: 0.30 }
    - page_load_speed: { weight: 0.20 }
    - lead_capture_rate: { weight: 0.25 }
    - content_freshness: { weight: 0.25 }

continuous_improvement:
  cycle:
    - step: compare_planned_vs_actual
      owner: AGT-MKT-CONTENT
      input: content_outcomes
      output: variance_report
    - step: identify_bottlenecks
      owner: AGT-MKT-CONTENT
      input: variance_report
      output: bottleneck_list
    - step: update_artifacts
      owner: AGT-MKT-CONTENT
      input: bottleneck_list
      output: updated_playbook
      artifacts_affected: [content_style_guide, seo_playbook]
    - step: record_lessons
      owner: AGT-MKT-CONTENT
      input: bottleneck_list
      output: new_lessons
    - step: update_benchmarks
      owner: AGT-MKT-CONTENT
      input: specialist_metrics
      output: benchmark_update
    - step: founder_review
      owner: HUM-000001
      input: weekly_review
      output: approved_or_revised
      frequency: weekly

  improvement_sources:
    - content_analytics: "what content performs best"
    - seo_reports: "ranking changes and traffic sources"
    - lead_attribution: "which content generates leads"

  metrics_tracked:
    - content_engagement_rate
    - lead_generation_rate
    - seo_ranking_changes
    - hard_fail_count_per_period

  review_cadence:
    daily: [content_performance_check]
    weekly: [pipeline_review, content_planning]
    monthly: [traffic_analysis, lead_attribution, seo_audit]
    quarterly: [strategy_review, brand_audit]

evaluation_pipeline:
  1. agent_completes_task:
     output: raw_result
  2. self_check_passes:
     condition: all self_check questions return true
  3. evaluator_scores:
     metrics: specialist_metrics[agent_id]
     hard_fail_check: any metric with hard_fail_if condition
  4. result:
     - pass: store_artifact + update_memory
     - fail_hard: reject_output + alert_founder + log_failure
     - fail_soft: return_to_agent_with_feedback + retry
     - low_confidence: escalate_to_founder_with_context
