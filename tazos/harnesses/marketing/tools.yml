# TAZ OS MARKETING HARNESS — Tools

id: TOL-MKT-001
name: Marketing Harness Tool Registry
harness: HAR-MKT-001
version: 1.0.0

tools:
  - id: TOL-MKT-001
    name: Content Generator
    capability: generate_content
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-MKT-CONTENT]
    inputs:
      required: [topic, format, target_audience]
      optional: [brand_guidelines, seo_keywords]
    outputs: [content_path, status]

  - id: TOL-MKT-002
    name: LinkedIn Publisher
    capability: publish_linkedin
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-MKT-LINKEDIN]
      execute: gated
    inputs:
      required: [content]
      optional: [scheduled_time, hashtags]
    outputs: [post_id, status]
    approval_gate: "External publishing requires founder approval"

  - id: TOL-MKT-003
    name: SEO Analyzer
    capability: analyze_seo
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-MKT-SEO]
    inputs:
      required: [url_or_content]
      optional: [target_keywords]
    outputs: [seo_score, recommendations]

  - id: TOL-MKT-004
    name: Document Generator
    capability: generate_document
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-MKT-CONTENT, AGT-MKT-WEB]
    inputs:
      required: [template, content]
    outputs: [document_path, status]

  - id: TOL-MKT-005
    name: Memory Writer
    capability: write_memory
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [per memory.yml permissions]
    inputs:
      required: [memory_key, content, classification]
    outputs: [status]

compositions:
  - name: content_to_lead
    steps:
      - capability: generate_content
      - capability: publish_linkedin
      - capability: analyze_seo
      - capability: write_memory
    owner: Marketing Harness (dispatched to)

providers:
  linkedin:
    preferred: null
    fallback: [manual]
  website_cms:
    preferred: null
    fallback: [manual]
  seo_tools:
    preferred: null
    fallback: [manual]
