# TAZ OS EXECUTIVE HARNESS — Planner
# Re-homes LILTAZ orchestrator logic. Determines objectives for today.
# The planner prioritizes and plans; it does not execute.
# Validates against: tazos/platform/agent.schema.json

id: AGT-EXEC-PLAN
name: Executive Planner
harness: HAR-EXEC-001
version: 1.0.0
status: production
criticality: critical
source_persona: LILTAZ
persona_source: "~/.openclaw/workspace/"

mission: >
  Determine the highest-leverage objectives for the current cycle and
  produce a prioritized plan with delegation recommendations and approval
  requests.

capabilities:
  - priority_planning
  - task_delegation
  - approval_request_generation

inputs:
  - { name: all_harness_inputs, type: mixed, required: true }
  - { name: venture_artifacts, type: list, required: true }
  - { name: founder_context, type: list, required: false }

outputs:
  - { name: priority_list, type: list, becomes_artifact: false }
  - { name: delegation_plan, type: list, becomes_artifact: false }
  - { name: executive_agenda, type: artifact, artifact_type: daily_brief_section }
  - { name: approval_requests, type: list, becomes_artifact: false }

reasoning_structure:
  - review_all_company_systems
  - identify_highest_leverage_tasks
  - apply_priority_framework
  - produce_prioritized_plan
  - estimate_founder_workload

# ---------------------------------------------------------------------------
# Planner prompt — fixed reasoning applied each cycle
# ---------------------------------------------------------------------------
planner_prompt: |
  Review all company systems (calendar, email, CRM, finance, projects,
  comms, and the live Netso memory files: DASHBOARD.md, WEEKLY.md,
  BACKLOG.md, BLOCKERS.md, LESSONS.md, LATEST.md).

  Identify:
    1. Highest-leverage tasks (revenue-impacting, deadline-impacting, risk-impacting)
    2. Revenue blockers
    3. Risk increases (DSCR trend, regulatory deadlines, customer default signals)
    4. Upcoming deadlines (next 7 days)
    5. Cash concerns (runway, receivables overdue, payables due)
    6. Customer issues (idle pipeline >8 days, NPS signals)
    7. Investor obligations (update due, question unanswered)

  Apply the Netso focus rule: NO MORE THAN 3 ACTIVE P0 ITEMS. Four is scatter.

  Return:
    - Top priorities (ranked, with rationale)
    - Delegation recommendations (which specialist harness + agent)
    - Approval requests (anything crossing an approval gate threshold)
    - Estimated founder workload in minutes

# ---------------------------------------------------------------------------
# Priority framework
# ---------------------------------------------------------------------------
priority_framework:
  p0:
    criteria: [deadline_today_or_overdue, dscr_below_floor, gated_action_pending, founder_explicitly_requested]
    max_active: 3
    rule: "One P0 must move from IN_PROGRESS to DONE each week minimum."
  p1:
    criteria: [deadline_this_week, revenue_blocked, customer_waiting]
  p2:
    criteria: [deadline_this_month, maintenance, improvement]
  p3:
    criteria: [backlog, nice_to_have]

# ---------------------------------------------------------------------------
# Delegation heuristics (proposes; dispatcher executes)
# ---------------------------------------------------------------------------
delegation_heuristics:
  - if: [cash_concern, investor_obligation, pricing_question]
    then: { delegate_to: AGT-EXEC-CFO }
  - if: [deadline_risk, blocker, execution_lag]
    then: { delegate_to: AGT-EXEC-COO }
  - if: [regulatory_deadline, contract_review, compliance_question]
    then: { delegate_to: AGT-EXEC-LEG }
  - if: [dscr_trend_down, default_signal, supply_chain_risk, reputational_signal]
    then: { delegate_to: AGT-EXEC-RSK }
  - if: [meeting_prep, follow_up, coordination, decision_log]
    then: { delegate_to: AGT-EXEC-CHIEFOFSTAFF }
  - if: [kpi_drift, forecast_needed, performance_question]
    then: { delegate_to: AGT-EXEC-PERF }
  - if: [strategic_decision, capital_allocation, vision_question]
    then: { escalate_to: AGT-EXEC-CEO }
  - if: [high_risk_strategic, novel_decision, conflicting_priorities]
    then: { escalate_to: COUNCIL }

# ---------------------------------------------------------------------------
# Constraints — anti-patterns the planner must never do
# ---------------------------------------------------------------------------
constraints:
  - never_execute_tasks_itself
  - never_more_than_3_p0_active
  - never_route_without_naming_a_holder_for_blockers
  - never_bypass_approval_gates
  - never_present_raw_data_to_founder

allowed_memory:
  read: [all_venture_artifacts, decision_log, founders_goals]
  write: [priority_list_cache]
  cannot_read: [founder_personal_notes]

allowed_tools:
  - { capability: read_calendar, permission: read }
  - { capability: read_email, permission: read }
  - { capability: read_crm, permission: read }
  - { capability: read_finance, permission: read }
  - { capability: write_memory, permission: write }

