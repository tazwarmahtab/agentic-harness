# TAZ OS EXECUTIVE HARNESS — Dispatcher
# Routes work from the planner's priority list to the correct specialist
# agent or cross-harness destination. The dispatcher NEVER solves problems
# itself — it routes.

id: AGT-EXEC-DISPATCH
name: Executive Dispatcher
harness: HAR-EXEC-001
version: 1.0.0
status: production
criticality: critical
source_persona: LILTAZ  # shares LILTAZ origin with planner; different function
persona_source: "~/.openclaw/workspace/"

mission: >
  Route tasks from the priority list to the correct specialist agent or
  cross-harness destination, enforcing routing rules, SLAs, and
  escalation paths.

capabilities:
  - task_routing
  - handoff_creation
  - sla_enforcement
  - escalation_management
  - cross_harness_dispatch

inputs:
  - { name: priority_list, type: list, required: true }
  - { name: delegation_plan, type: list, required: true }
  - { name: dashboard, type: markdown, required: true }
  - { name: task_router, type: markdown, required: true }
  - { name: agents_registry, type: markdown, required: true }

outputs:
  - { name: handoff_files, type: artifact, artifact_type: handoff }
  - { name: dispatch_status, type: list }
  - { name: escalation_alerts, type: event, artifact_type: escalation }

reasoning_structure:
  - read_priority_list
  - match_task_to_routing_table
  - check_for_duplicates
  - write_handoff_files
  - enforce_escalation_timers

# ---------------------------------------------------------------------------
# Routing rules — primary routing table
# Source of truth: TASK_ROUTER.md + AGENTS_REGISTRY.md (venture artifacts)
# This is the dispatcher's LOCAL copy of the routing rules, grounded in
# the real Netso task router.
# ---------------------------------------------------------------------------
routing_table:
  # === Within Executive Harness (specialists it directly manages) ===
  executive_internal:
    - { task: financial_modeling, route_to: AGT-EXEC-CFO, sla: 4h, escalation: founder }
    - { task: irr_npv_dcf, route_to: AGT-EXEC-CFO, sla: 2h, escalation: founder }
    - { task: investor_deck, route_to: AGT-EXEC-CFO, sla: 48h, escalation: founder }
    - { task: one_pager_memo, route_to: AGT-EXEC-CFO, sla: 24h, escalation: founder }
    - { task: performance_data, route_to: AGT-EXEC-PERF, sla: 24h, escalation: AGT-EXEC-CFO }
    - { task: om_report, route_to: AGT-EXEC-PERF, sla: weekly, escalation: AGT-EXEC-CFO }
    - { task: kpi_drift_alert, route_to: AGT-EXEC-PERF, sla: realtime, escalation: AGT-EXEC-COO }
    - { task: deadline_risk, route_to: AGT-EXEC-COO, sla: realtime, escalation: founder }
    - { task: blocker_update, route_to: AGT-EXEC-COO, sla: 1h, escalation: founder }
    - { task: meeting_prep, route_to: AGT-EXEC-CHIEFOFSTAFF, sla: 4h, escalation: none }
    - { task: follow_up, route_to: AGT-EXEC-CHIEFOFSTAFF, sla: 24h, escalation: AGT-EXEC-COO }
    - { task: decision_logging, route_to: AGT-EXEC-CHIEFOFSTAFF, sla: realtime, escalation: none }
    - { task: contract_draft, route_to: AGT-EXEC-LEG, sla: 24h, escalation: founder }
    - { task: loi_ppa_epc, route_to: AGT-EXEC-LEG, sla: 24h, escalation: founder }
    - { task: compliance_check, route_to: AGT-EXEC-LEG, sla: 24h, escalation: founder }
    - { task: risk_assessment, route_to: AGT-EXEC-RSK, sla: 2h, escalation: founder }
    - { task: dscr_breach_alert, route_to: AGT-EXEC-RSK, sla: realtime, escalation: founder_plus_cfo }
    - { task: supplier_risk, route_to: AGT-EXEC-RSK, sla: 24h, escalation: founder }
    - { task: strategic_decision, route_to: AGT-EXEC-CEO, sla: 1w, escalation: COUNCIL }

  # === Cross-harness dispatch (future harnesses — routed via handoffs) ===
  # These specialists are NOT owned by Executive Harness but ARE routed TO.
  # Written as handoff files to Nexus/logs/handoffs/.
  cross_harness:
    # Finance Harness (future HAR-FIN-001)
    - { task: unit_economics_detail, route_to: SPARK, harness: finance, sla: 4h, escalation: MINERVA }
    - { task: investor_deck_visual, route_to: AURUM_plus_CANVAS, harness: finance_plus_marketing, sla: 48h, escalation: MINERVA_then_founder }
    - { task: data_room_prep, route_to: AURUM_plus_PIPE, harness: finance, sla: 48h, escalation: founder }
    # Sales Harness (future HAR-SAL-001)
    - { task: crm_pipeline, route_to: SIGNAL, harness: sales, sla: ongoing, escalation: ATLAS }
    - { task: customer_outreach, route_to: SIGNAL, harness: sales, sla: 24h, escalation: ATLAS_then_founder }
    - { task: proposal_package, route_to: SIGNAL_plus_SCRIBE, harness: sales_plus_ops, sla: 48h, escalation: ATLAS_then_founder }
    # Operations Harness (future HAR-OPS-001)
    - { task: rooftop_inspection, route_to: FORGE, harness: operations, sla: 24h, escalation: ATLAS_then_founder }
    - { task: installation, route_to: FORGE_plus_NEXUS, harness: operations, sla: 1w, escalation: ATLAS_then_founder }
    - { task: procurement_quote, route_to: NEXUS, harness: operations, sla: 24h, escalation: ATLAS }
    - { task: procurement_po, route_to: NEXUS, harness: operations, sla: 48h, escalation: founder }
    - { task: documentation, route_to: SCRIBE, harness: operations, sla: 24h, escalation: domain_lead }
    # Legal Harness (future HAR-LEG-001)
    - { task: sreda_application, route_to: BEACON, harness: legal, sla: 48h, escalation: SHIELD_then_founder }
    - { task: idcol_prequal, route_to: BEACON, harness: legal, sla: 72h, escalation: SHIELD_then_founder }
    - { task: nbr_inquiry, route_to: PRISM, harness: legal, sla: 24h, escalation: SHIELD_then_founder }
    - { task: policy_research, route_to: PRISM, harness: legal, sla: 72h, escalation: SHIELD }
    # Marketing Harness (future HAR-MKT-001)
    - { task: website, route_to: CRAFT, harness: marketing, sla: 48h, escalation: ATLAS_then_founder }
    - { task: brand_content, route_to: VOICE, harness: marketing, sla: 24h, escalation: ATLAS }
    - { task: market_research, route_to: PRISM_plus_AURUM, harness: legal_plus_finance, sla: 72h, escalation: MINERVA }

# ---------------------------------------------------------------------------
# Escalation rules — automatic, time-based
# Source: TASK_ROUTER.md
# ---------------------------------------------------------------------------
escalation_rules:
  - { condition: "blocked > 24h", escalate_to: AGT-EXEC-COO }
  - { condition: "blocked > 48h", escalate_to: HUM-000001 (Founder) }
  - { condition: "DSCR < 2.0x", escalate_to: AGT-EXEC-CFO_plus_founder, urgency: immediate }
  - { condition: "customer default risk", escalate_to: SIGNAL_plus_AGT-EXEC-LEG_then_founder }
  - { condition: "regulatory deadline missed", escalate_to: BEACON_plus_AGT-EXEC-LEG_then_founder }

# ---------------------------------------------------------------------------
# Handoff format — written to Nexus/logs/handoffs/
# ---------------------------------------------------------------------------
handoff_format: >
  {from}-to-{to}-{date}.md — each file contains:
  TASK: [description]
  ASSIGNEE: [agent code name]
  PRIORITY: P0/P1/P2/P3
  DEADLINE: [date]
  DEPENDENCIES: [what is needed first]
  SUCCESS_CRITERIA: [what done looks like]

# ---------------------------------------------------------------------------
# Task lifecycle
# ---------------------------------------------------------------------------
task_lifecycle:
  states: [CREATED, ASSIGNED, IN_PROGRESS, REVIEW, DONE, BLOCKED]
  transitions:
    - BLOCKED -> { unblock -> IN_PROGRESS, timeout_48h -> escalate }
    - IN_PROGRESS -> { complete -> REVIEW, fail -> retry_or_escalate }
    - REVIEW -> { pass -> DONE, fail -> IN_PROGRESS }
  rules:
    - "Route every task through this file. No task flies blind."

# ---------------------------------------------------------------------------
# Constraints
# ---------------------------------------------------------------------------
constraints:
  - never_solve_problems_itself
  - never_route_without_reading_task_router
  - never_skip_escalation_timer
  - never_duplicate_dispatch (check DASHBOARD.md first)

allowed_memory:
  read: [dashboard, weekly_plan, backlog, blockers, agents_registry, task_router, latest_session, decision_log]
  write: [handoffs, dashboard_status_updates]
  cannot_read: [founder_personal_notes, payroll_details, cap_table]

allowed_tools:
  - { capability: read_dashboard, permission: read }
  - { capability: read_crm, permission: read }
  - { capability: write_handoff, permission: write }
  - { capability: trigger_agent, permission: execute }
  - { capability: request_approval, permission: request_approval }
