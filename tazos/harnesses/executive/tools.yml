# TAZ OS EXECUTIVE HARNESS — Tools
# Capability-based tool definitions. Agents request capabilities, not
# providers. The runtime resolves to actual providers.
# See Volume 9 — Tool & Integration Framework.

id: TOL-EXEC-001
name: Executive Harness Tool Registry
harness: HAR-EXEC-001
version: 1.0.0

# ===========================================================================
# TOOL DEFINITIONS — every tool follows the canonical contract
# ===========================================================================
tools:
  # ---------------------------------------------------------------------------
  # COMMUNICATION
  # ---------------------------------------------------------------------------
  - id: TOL-EXEC-001
    name: Email Service
    capability: send_email
    category: communication
    version: 1.0.0
    status: registered  # no provider wired yet
    permissions:
      read: [AGT-EXEC-CHIEFOFSTAFF, AGT-EXEC-CFO]
      write: [AGT-EXEC-CHIEFOFSTAFF, AGT-EXEC-CFO]
      execute: gated  # requires approval for external send
    inputs:
      required: [recipient, subject, body]
      optional: [attachments, cc, bcc]
    outputs: [status, request_id]
    rate_limits: { max_per_hour: 20 }
    retry_policy: { max_attempts: 3, backoff: exponential }
    cost_model: tbd
    approval_gate: "External email to investors requires founder approval"
    fallback: null

  - id: TOL-EXEC-002
    name: Email Reader
    capability: read_email
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-EXEC-CHIEFOFSTAFF, AGT-EXEC-CFO]
    inputs:
      required: []
      optional: [folder, date_range, sender, unread_only]
    outputs: [messages, count]
    retry_policy: { max_attempts: 2 }

  - id: TOL-EXEC-003
    name: Calendar Service
    capability: read_calendar
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-EXEC-CHIEFOFSTAFF, AGT-EXEC-COO]
    inputs:
      required: []
      optional: [date_range, attendee, type]
    outputs: [events, conflicts, free_slots]

  # ---------------------------------------------------------------------------
  # DOCUMENT GENERATION
  # ---------------------------------------------------------------------------
  - id: TOL-EXEC-004
    name: Document Generator
    capability: generate_document
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-EXEC-CHIEFOFSTAFF, AGT-EXEC-CFO, AGT-EXEC-PERF, AGT-EXEC-LEG]
    inputs:
      required: [template, content]
      optional: [format, output_path]
    outputs: [document_path, status]
    approval_gate: "Investor-facing documents require founder approval before send"

  - id: TOL-EXEC-005
    name: Report Generator
    capability: generate_report
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-EXEC-PERF, AGT-EXEC-CFO]
    inputs:
      required: [report_type, data_source]
      optional: [format, period, recipients]
    outputs: [report_path, summary]

  # ---------------------------------------------------------------------------
  # FINANCE
  # ---------------------------------------------------------------------------
  - id: TOL-EXEC-006
    name: Finance Reader
    capability: read_finance
    category: finance
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-EXEC-CFO, AGT-EXEC-CEO, AGT-EXEC-RSK, AGT-EXEC-PERF]
    inputs:
      required: []
      optional: [metric, date_range, project]
    outputs: [financial_data, status]

  - id: TOL-EXEC-007
    name: Financial Model Tool
    capability: write_financial_model
    category: finance
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-EXEC-CFO]
      execute: gated
    inputs:
      required: [scenario, parameters]
      optional: [custom_assumptions]
    outputs: [model_path, summary, compliance_check]
    approval_gate: "Any model using non-standard assumptions requires CFO + founder approval"
    validation:
      must_use: ground_truth_constants
      hard_fail_if: "blended_rate_for_savings"

  # ---------------------------------------------------------------------------
  # CRM / PIPELINE
  # ---------------------------------------------------------------------------
  - id: TOL-EXEC-008
    name: CRM Reader
    capability: read_crm
    category: crm
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-EXEC-COO, AGT-EXEC-CHIEFOFSTAFF, AGT-EXEC-CEO, AGT-EXEC-PERF]
    inputs:
      required: []
      optional: [stage, date_range, assigned_to]
    outputs: [pipeline, leads, stages]

  # ---------------------------------------------------------------------------
  # DASHBOARD / MEMORY
  # ---------------------------------------------------------------------------
  - id: TOL-EXEC-009
    name: Dashboard Reader
    capability: read_dashboard
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      read: [all_executive_specialists]
    inputs:
      required: []
    outputs: [dashboard_content]

  - id: TOL-EXEC-010
    name: Dashboard Writer
    capability: write_dashboard
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-EXEC-COO]
    inputs:
      required: [updated_content]
    outputs: [status]
    note: "Only AGT-EXEC-COO may write DASHBOARD.md. Updated after EVERY action."

  - id: TOL-EXEC-011
    name: Handoff Writer
    capability: write_handoff
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-EXEC-DISPATCH]
    inputs:
      required: [from, to, task, priority, deadline, success_criteria]
    outputs: [handoff_path, status]
    format: "{from}-to-{to}-{date}.md"

  - id: TOL-EXEC-012
    name: Memory Writer
    capability: write_memory
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [per memory.yml permissions]
    inputs:
      required: [memory_key, content, classification]
    outputs: [status]
    note: "Agents submit memory candidates. Reflection engine decides: store, reject, summarize, merge, version."

  - id: TOL-EXEC-013
    name: Knowledge Graph Reader
    capability: read_knowledge_graph
    category: knowledge
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-EXEC-CEO, AGT-EXEC-CFO, AGT-EXEC-LEG, AGT-EXEC-RSK]
    inputs:
      required: [query]
      optional: [depth, entity_type, relationship]
    outputs: [entities, relationships, confidence]

  # ---------------------------------------------------------------------------
  # EXECUTION
  # ---------------------------------------------------------------------------
  - id: TOL-EXEC-014
    name: Agent Trigger
    capability: trigger_agent
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      execute: [AGT-EXEC-DISPATCH]
    inputs:
      required: [agent_id, task]
      optional: [priority, deadline, context]
    outputs: [dispatch_status, tracking_id]

  - id: TOL-EXEC-015
    name: Approval Request
    capability: request_approval
    category: governance
    version: 1.0.0
    status: registered
    permissions:
      execute: [all_executive_specialists]
    inputs:
      required: [action, rationale, risk_assessment]
      optional: [deadline, urgency]
    outputs: [approval_id, status, queue_position]

  - id: TOL-EXEC-016
    name: Escalation Alert
    capability: send_escalation_alert
    category: governance
    version: 1.0.0
    status: registered
    permissions:
      execute: [AGT-EXEC-RSK, AGT-EXEC-PERF]
    inputs:
      required: [alert_type, severity, target, description]
      optional: [context, source_data]
    outputs: [alert_id, status, delivery_confirmation]

  - id: TOL-EXEC-017
    name: Brief Generator
    capability: generate_brief
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-EXEC-CHIEFOFSTAFF]
    inputs:
      required: [brief_type, inputs]
      optional: [format, audience]
    outputs: [brief_content, estimated_founder_workload_minutes]

# ===========================================================================
# TOOL COMPOSITION — complex actions from simple capabilities
# ===========================================================================
compositions:
  - name: prepare_proposal_package
    steps:
      - capability: generate_financial_model  # via CFO agent
      - capability: generate_document          # proposal PDF
      - capability: write_memory               # store in knowledge
      - capability: request_approval           # founder gate
    owner: Sales Harness (dispatched to)

  - name: send_investor_update
    steps:
      - capability: generate_report           # CFO writes draft
      - capability: request_approval          # founder gate
      - capability: send_email                 # gated
    owner: AGT-EXEC-CFO

  - name: daily_executive_loop
    steps:
      - capability: read_dashboard
      - capability: read_email
      - capability: read_calendar
      - capability: read_crm
      - capability: read_finance
      - capability: generate_brief
    owner: AGT-EXEC-CHIEFOFSTAFF

# ===========================================================================
# PROVIDERS — not yet wired (runtime will resolve)
# ===========================================================================
providers:
  email:
    preferred: null       # to be wired: Microsoft Graph / Gmail
    fallback: [smtp]
  calendar:
    preferred: null       # to be wired: Google Calendar / Outlook
  crm:
    preferred: null       # to be wired: HubSpot / Zoho / custom
  finance:
    preferred: null       # to be wired: QuickBooks / Xero / spreadsheet
  document_storage:
    preferred: null       # to be wired: Google Drive / local
  knowledge_graph:
    preferred: null       # to be wired: Neo4j / codebase-memory / Obsidian
