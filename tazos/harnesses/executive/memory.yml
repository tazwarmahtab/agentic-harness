# TAZ OS EXECUTIVE HARNESS — Shared Memory
# Standardized memory for the Executive Harness. Three layers:
#   Long-term (company facts), Episodic (events), Semantic (how things work).
# All paths resolve to real Netso_HQ artifacts via venture.yml refs.
# No duplication — always read from source.

id: MEM-EXEC-001
name: Executive Harness Shared Memory
harness: HAR-EXEC-001
version: 1.0.0

# ===========================================================================
# MEMORY LAYERS
# ===========================================================================
layers:
  # ---------------------------------------------------------------------------
  # LONG-TERM — persistent company facts, rarely change
  # ---------------------------------------------------------------------------
  long_term:
    company_facts:
      - key: legal_entity_name
        value: "Netso Energy"
        classification: internal
      - key: primary_market
        value: "Bangladesh RMG sector rooftop solar (BOO/OPEX)"
        classification: internal
      - key: primary_customer
        value: "CGS (Chattogram Garments)"
        classification: internal
      - key: tariff_category
        value: "MT-2 (Medium Tension)"
        classification: internal
    financial_ground_truth:
      ref: ground_truth_constants  # venture.yml artifact ref
      description: "All financial numbers. Generated by core_economics.py. NEVER edit manually."
      classification: confidential
    projects:
      description: "Project records, stages, financials"
      ref: projects/
    customers:
      description: "Customer records, contacts, PPA status"
      ref: crm/  # when CRM is wired
    investors:
      description: "Investor contacts, communications, data room status"
      classification: restricted
    suppliers:
      description: "Supplier contacts, quotes, performance history"
      classification: internal
    equipment_library:
      description: "Panels, inverters, BOM templates, specs"
      classification: internal
    pricing_history:
      description: "Historical proposals, pricing decisions, margin records"
      classification: confidential
    contracts:
      description: "All signed contracts, LOIs, NDAs, PPAs"
      classification: restricted
    policies:
      description: "Company policies, operating procedures, approval rules"
      classification: internal

  # ---------------------------------------------------------------------------
  # EPISODIC — events, meetings, decisions (time-sequenced)
  # ---------------------------------------------------------------------------
  episodic:
    daily_dashboard:
      ref: dashboard            # ai_system/System/DO/DASHBOARD.md
      role: "Live state — read first every session"
      write_access: [AGT-EXEC-COO]
      classification: internal
    weekly_plan:
      ref: weekly_plan          # ai_system/System/PLAN/WEEKLY.md
      role: "Top 3 priorities for the week"
      write_access: [AGT-EXEC-COO, HUM-000001]
      classification: internal
    backlog:
      ref: backlog              # ai_system/System/PLAN/BACKLOG.md
      write_access: [AGT-EXEC-COO]
      classification: internal
    blockers:
      ref: blockers             # ai_system/System/ACT/BLOCKERS.md
      role: "Active blockers, each naming a holder"
      write_access: [AGT-EXEC-COO]
      classification: internal
    lessons:
      ref: lessons              # ai_system/System/ACT/LESSONS.md
      role: "Patterns learned, mistakes to avoid"
      write_access: [AGT-EXEC-COO, HUM-000001]
      classification: internal
    weekly_review:
      ref: weekly_review        # ai_system/System/CHECK/REVIEW.md
      write_access: [AGT-EXEC-COO, AGT-EXEC-PERF]
      classification: internal
    session_log:
      ref: latest_session       # ai_system/Nexus/logs/LATEST.md
      role: "Current session context — read at startup, update at shutdown"
      write_access: [AGT-EXEC-COO, AGT-EXEC-CHIEFOFSTAFF]
      classification: internal
    decision_log:
      path: decision_log/
      role: "Immutable record of every decision with rationale, identity, alternatives"
      write_access: [AGT-EXEC-CHIEFOFSTAFF]
      format:
        timestamp: required
        decision: required
        rationale: required
        identity: required
        alternatives_considered: required
        confidence: required
        review_date: "30 days from decision"
      classification: internal
    handoffs:
      ref: handoffs             # ai_system/Nexus/logs/handoffs/
      role: "Inter-harness task routing"
      write_access: [AGT-EXEC-DISPATCH]
      classification: internal
    meeting_transcripts:
      description: "Summaries of meetings with customers, investors, suppliers"
      classification: confidential
    email_threads:
      description: "Key email threads with context preserved"
      classification: confidential

  # ---------------------------------------------------------------------------
  # SEMANTIC — how Netso operates (rules, patterns, standards)
  # ---------------------------------------------------------------------------
  semantic:
    engineering_standards:
      description: "PV design standards, SLD requirements, yield modeling methods"
      classification: internal
    financial_assumptions:
      ref: ground_truth_constants
      description: "All financial assumptions locked by core_economics.py"
      classification: confidential
    operating_procedures:
      ref: sops/                 # this harness's SOP library
      description: "How the Executive Harness operates"
      classification: internal
    pricing_model:
      description: "Netso pricing methodology — PPA rate, escalation, margin targets"
      classification: confidential
    approval_rules:
      ref: approvals.yml
      description: "When and why things need founder approval"
      classification: internal
    task_routing:
      ref: task_router           # venture.yml artifact ref
      description: "How tasks get routed between agents and harnesses"
      classification: internal

# ===========================================================================
# MEMORY PERMISSIONS — per-specialist least-privilege
# ===========================================================================
permissions:
  AGT-EXEC-CEO:
    read: [all_long_term, all_episodic, all_semantic]
    write: [decision_log]
    cannot_read: [founder_personal_notes, personal_health]

  AGT-EXEC-COO:
    read: [dashboard, weekly_plan, backlog, blockers, lessons, latest_session, agents_registry, task_router, decision_log, handoffs]
    write: [dashboard, blockers, handoffs, latest_session]
    cannot_read: [founder_personal_notes, cap_table, raw_financial_models, investor_correspondence]

  AGT-EXEC-CFO:
    read: [ground_truth_constants, financial_models, investor_correspondence, cap_table, cash_flow_history, project_economics, decision_log, dashboard]
    write: [investor_update_drafts, financial_forecasts]
    cannot_read: [founder_personal_notes, personal_health]

  AGT-EXEC-CHIEFOFSTAFF:
    read: [all_episodic, decision_log, calendar, email, meeting_notes, investor_correspondence, weekly_plan, backlog]
    write: [decision_log, daily_brief_drafts, follow_up_tracker, approval_queue_drafts]
    cannot_read: [founder_personal_notes, cap_table_unless_investor_meeting]

  AGT-EXEC-LEG:
    read: [contracts, legal_policies, regulatory_documents, sreda_status, idcol_status, nbr_inquiries, compliance_records, decision_log]
    write: [contract_review_drafts, compliance_reports, nda_drafts]
    cannot_read: [founder_personal_notes, personal_health, raw_financial_models_unless_contract_related]

  AGT-EXEC-RSK:
    read: [financial_data, project_risks, supplier_records, customer_records, regulatory_status, ground_truth_constants, risk_history, decision_log]
    write: [risk_assessments, escalation_alerts, risk_state]
    cannot_read: [founder_personal_notes, personal_health, marketing_creative]

  AGT-EXEC-PERF:
    read: [dashboard, ground_truth_constants, financial_data, pipeline_data, project_data, kpi_history, previous_reports, decision_log]
    write: [kpi_reports, forecasts, drift_alerts]
    cannot_read: [founder_personal_notes, cap_table, legal_contracts_unless_financial, personal_health]

# ===========================================================================
# MEMORY UPDATE RULES — agents don't write freely
# ===========================================================================
update_rules:
  - agents_submit_memory_candidates: true
  - reflection_engine_decides: [store, reject, summarize, merge, version]
  - purpose: "Prevent memory pollution. No agent can write arbitrary memory."
  - audit: every memory write creates immutable audit record
