# TAZ OS LEGAL HARNESS — Evaluation Metrics

id: EVAL-LEG-001
name: Legal Harness Evaluation Framework
harness: HAR-LEG-001
version: 1.0.0

harness_metrics:
  - name: contract_review_accuracy
    target: "100%"
    frequency: realtime
    owner: AGT-LEG-REV
    measurement: contracts_reviewed_without_errors

  - name: regulatory_deadline_hit_rate
    target: "100%"
    frequency: monthly
    owner: AGT-LEG-COMP
    measurement: filings_submitted_before_deadline

  - name: compliance_gap_detection
    target: "100%"
    frequency: monthly
    owner: AGT-LEG-COMP
    measurement: gaps_detected_before_penalty

  - name: approval_routing_compliance
    target: "100%"
    frequency: realtime
    owner: AGT-LEG-REV
    measurement: zero_contracts_sent_without_approval

specialist_metrics:
  AGT-LEG-COMP:
    - regulatory_coverage: { weight: 0.35 }
    - deadline_accuracy: { weight: 0.30 }
    - gap_detection: { weight: 0.20 }
    - documentation_quality: { weight: 0.15 }

  AGT-LEG-REV:
    - review_accuracy: { weight: 0.35 }
    - redline_quality: { weight: 0.25 }
    - turnaround_time: { weight: 0.20 }
    - approval_compliance: { weight: 0.20, hard_fail_if: "contract_sent_without_approval" }

  AGT-LEG-LOI:
    - financial_accuracy: { weight: 0.30, hard_fail_if: "wrong_financial_constants" }
    - terms_completeness: { weight: 0.25 }
    - founder_approval_rate: { weight: 0.25 }
    - turnaround_time: { weight: 0.20 }

  AGT-LEG-NDA:
    - bilateral_symmetry: { weight: 0.30 }
    - term_compliance: { weight: 0.30, hard_fail_if: "nda_term_exceeds_2_years" }
    - scope_accuracy: { weight: 0.20 }
    - turnaround_time: { weight: 0.20 }

  AGT-LEG-PPA:
    - rate_accuracy: { weight: 0.40, hard_fail_if: "ppa_rate_not_10_00" }
    - escalation_accuracy: { weight: 0.25 }
    - nem_export_accuracy: { weight: 0.15 }
    - founder_approval_rate: { weight: 0.20 }

continuous_improvement:
  cycle:
    - step: compare_planned_vs_actual
      owner: AGT-LEG-COMP
      input: contract_outcomes
      output: variance_report
    - step: identify_bottlenecks
      owner: AGT-LEG-REV
      input: variance_report
      output: bottleneck_list
    - step: update_artifacts
      owner: AGT-LEG-REV
      input: bottleneck_list
      output: updated_templates_and_sops
      artifacts_affected: [contract_templates, sops/]
    - step: record_lessons
      owner: AGT-LEG-COMP
      input: bottleneck_list
      output: new_lessons
    - step: update_benchmarks
      owner: AGT-LEG-REV
      input: specialist_metrics
      output: benchmark_update
    - step: founder_review
      owner: HUM-000001
      input: monthly_review
      output: approved_or_revised
      frequency: monthly

  improvement_sources:
    - monthly_review: "contract review outcomes"
    - lessons: "legal errors and corrections"
    - regulatory_changes: "new regulations affecting operations"

  metrics_tracked:
    - contract_accuracy_rate
    - regulatory_compliance_rate
    - hard_fail_count_per_period
    - approval_latency_hours

  review_cadence:
    daily: [contract_status_check, regulatory_deadline_check]
    weekly: [pipeline_review, template_update]
    monthly: [compliance_audit, regulatory_calendar_update]
    quarterly: [full_legal_audit, policy_review]

evaluation_pipeline:
  1. agent_completes_task:
     output: raw_result
  2. self_check_passes:
     condition: all self_check questions return true
  3. evaluator_scores:
     metrics: specialist_metrics[agent_id]
     hard_fail_check: any metric with hard_fail_if condition
  4. result:
     - pass: store_artifact + update_memory
     - fail_hard: reject_output + alert_founder + log_failure
     - fail_soft: return_to_agent_with_feedback + retry
     - low_confidence: escalate_to_founder_with_context
