# TAZ OS LEGAL HARNESS — Approval Gates

id: POL-LEG-001
name: Legal Approval Gates
harness: HAR-LEG-001
version: 1.0.0
status: production

rules:
  - id: POL-LEG-LEG-001
    name: Contract Signature
    category: legal
    rule:
      if:
        action: sign_contract
        contract_type: [loi, ppa, epc, nda]
      then: "Block. Founder is sole signatory authority."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 72

  - id: POL-LEG-LEG-002
    name: SREDA/IDCOL/NBR Submission
    category: legal
    rule:
      if:
        action: submit_regulatory_filing
        filing_type: [sreda, idcol, nbr]
      then: "Block. Founder approval required."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 72

  - id: POL-LEG-AI-001
    name: PPA Rate Enforcement
    category: ai_safety
    rule:
      if:
        action: generate_ppa
        ppa_rate: { not_equals: 10.00 }
      then: "HARD FAIL. PPA rate must be BDT 10.00/kWh."
    action: deny
    source: "GROUND_TRUTH_CONSTANTS.md"

  - id: POL-LEG-AI-002
    name: Blended Rate Prohibition
    category: ai_safety
    rule:
      if:
        action: any_legal_output
        uses_blended_rate_for_savings: true
      then: "HARD FAIL."
    action: deny

auto_actions:
  - generate_draft_nda
  - generate_draft_loi
  - review_contract
  - update_compliance_tracker
  - read_contract
  - update_nda_log

decision_queue_format:
  bundled: true
  summary_per_decision:
    - action_description
    - risk_assessment
    - "recommended: approve_or_reject"
  actions_available: [approve_all, review_individually, reject]
  delivery: console_queue

delegation:
  enabled: true
  rule: "Delegation is explicit and temporary."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
