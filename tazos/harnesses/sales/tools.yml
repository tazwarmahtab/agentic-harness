# TAZ OS SALES HARNESS — Tools
# Capability-based tool definitions for the Sales harness.

id: TOL-SAL-001
name: Sales Harness Tool Registry
harness: HAR-SAL-001
version: 1.0.0

# ===========================================================================
# TOOL DEFINITIONS
# ===========================================================================
tools:
  - id: TOL-SAL-001
    name: CRM Reader
    capability: read_crm
    category: crm
    version: 1.0.0
    status: registered
    permissions:
      read: [AGT-SAL-LEAD, AGT-SAL-OUT, AGT-SAL-PROP]
    inputs:
      required: []
      optional: [stage, date_range, assigned_to, lead_id]
    outputs: [pipeline, leads, stages, conversion_data]

  - id: TOL-SAL-002
    name: CRM Writer
    capability: write_crm
    category: crm
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-SAL-LEAD]
    inputs:
      required: [lead_id, field, value]
    outputs: [status, updated_record]

  - id: TOL-SAL-003
    name: Proposal Generator
    capability: generate_proposal
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-SAL-PROP]
    inputs:
      required: [customer_id, deal_value, terms]
      optional: [custom_assumptions, template]
    outputs: [proposal_path, summary, compliance_check]
    approval_gate: "Proposals > BDT 5M require founder approval before send"
    validation:
      must_use: ground_truth_constants
      hard_fail_if: "blended_rate_for_savings"

  - id: TOL-SAL-004
    name: Email Sender
    capability: send_email
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      execute: gated
    inputs:
      required: [recipient, subject, body]
      optional: [attachments, cc]
    outputs: [status, request_id]
    approval_gate: "External emails to investors require founder approval"
    rate_limits: { max_per_hour: 20 }

  - id: TOL-SAL-005
    name: Document Generator
    capability: generate_document
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-SAL-PROP, AGT-SAL-OUT]
    inputs:
      required: [template, content]
      optional: [format, output_path]
    outputs: [document_path, status]

  - id: TOL-SAL-006
    name: Approval Request
    capability: request_approval
    category: governance
    version: 1.0.0
    status: registered
    permissions:
      execute: [AGT-SAL-LEAD, AGT-SAL-PROP]
    inputs:
      required: [action, rationale, risk_assessment]
      optional: [deadline, urgency]
    outputs: [approval_id, status, queue_position]

  - id: TOL-SAL-007
    name: Memory Writer
    capability: write_memory
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [per memory.yml permissions]
    inputs:
      required: [memory_key, content, classification]
    outputs: [status]
    note: "Agents submit memory candidates. Reflection engine decides."

# ===========================================================================
# TOOL COMPOSITIONS
# ===========================================================================
compositions:
  - name: qualify_and_propose
    steps:
      - capability: read_crm
      - capability: write_crm          # update lead stage
      - capability: generate_proposal
      - capability: write_memory       # store in knowledge
      - capability: request_approval   # founder gate for >5M
    owner: Sales Harness (dispatched to)

  - name: outreach_sequence
    steps:
      - capability: read_crm
      - capability: send_email
      - capability: write_memory       # log outreach
    owner: AGT-SAL-OUT

# ===========================================================================
# PROVIDERS — not yet wired
# ===========================================================================
providers:
  crm:
    preferred: null
    fallback: [spreadsheet]
  email:
    preferred: null
    fallback: [smtp]
  document_storage:
    preferred: null
    fallback: [local]
