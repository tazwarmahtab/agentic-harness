# TAZ OS Sales Harness — Lead Qualifier
# Qualifies inbound leads and scores pipeline opportunities.

id: AGT-SAL-LEAD
name: Lead Qualifier
harness: HAR-SAL-001
version: 1.0.0
status: production
criticality: high
mission: >
  Qualify inbound leads, score opportunities based on ICP fit (Bangladesh RMG
  sector, rooftop solar potential), and route qualified leads to the proposal
  pipeline. Reject leads outside target market.

capabilities:
  - lead_scoring
  - icp_qualification
  - pipeline_routing

allowed_memory:
  read: [crm_pipeline, customer_profiles, qualification_criteria]
  write: [crm_pipeline]
  cannot_read: [founder_personal_notes, payroll_details]

allowed_tools:
  - { capability: read_crm, permission: read }
  - { capability: write_crm, permission: write }

reasoning_structure:
  - gather_lead_data
  - check_icp_fit
  - score_lead
  - route_qualified
  - log_decision

self_check:
  - "Does this lead fit the Bangladesh RMG rooftop solar ICP?"
  - "Is the scoring transparent and defensible?"
  - "Have I routed qualified leads to the right specialist?"

evaluation:
  - { metric: qualification_accuracy, weight: 0.40 }
  - { metric: icp_match_rate, weight: 0.35 }
  - { metric: routing_accuracy, weight: 0.25 }
