# TAZ OS INVESTOR RELATIONS HARNESS — Tools

id: TOL-INV-001
name: Investor Relations Harness Tool Registry
harness: HAR-INV-001
version: 1.0.0

tools:
  - id: TOL-INV-001
    name: Document Generator
    capability: generate_document
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-INV-DECK, AGT-INV-DD, AGT-INV-PROJ]
    inputs:
      required: [template, content]
    outputs: [document_path, status]

  - id: TOL-INV-002
    name: Email Sender
    capability: send_email
    category: communication
    version: 1.0.0
    status: registered
    permissions:
      execute: gated
    inputs:
      required: [recipient, subject, body]
    outputs: [status, request_id]
    approval_gate: "All investor emails require founder approval"

  - id: TOL-INV-003
    name: Report Generator
    capability: generate_report
    category: productivity
    version: 1.0.0
    status: registered
    permissions:
      write: [AGT-INV-PROJ, AGT-INV-TRACK]
    inputs:
      required: [report_type, data_source]
    outputs: [report_path, summary]

  - id: TOL-INV-004
    name: Approval Request
    capability: request_approval
    category: governance
    version: 1.0.0
    status: registered
    permissions:
      execute: [AGT-INV-CRM, AGT-INV-DECK, AGT-INV-DD, AGT-INV-PROJ, AGT-INV-TRACK]
    inputs:
      required: [action, rationale]
    outputs: [approval_id, status]

  - id: TOL-INV-005
    name: Memory Writer
    capability: write_memory
    category: internal
    version: 1.0.0
    status: registered
    permissions:
      write: [per memory.yml permissions]
    inputs:
      required: [memory_key, content, classification]
    outputs: [status]

compositions:
  - name: investor_update_cycle
    steps:
      - capability: generate_report
      - capability: generate_document
      - capability: request_approval
      - capability: send_email
    owner: AGT-INV-DECK

providers:
  email:
    preferred: null
    fallback: [manual]
  document_storage:
    preferred: null
    fallback: [local]
