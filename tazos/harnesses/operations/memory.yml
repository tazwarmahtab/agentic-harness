# TAZ OS OPERATIONS HARNESS — Shared Memory

id: MEM-OPS-001
name: Operations Harness Shared Memory
harness: HAR-OPS-001
version: 1.0.0

layers:
  long_term:
    engineering_standards:
      description: "PV design standards, SLD requirements, yield modeling"
      classification: internal
    supplier_database:
      description: "Approved suppliers, pricing, performance history"
      classification: internal
    equipment_specs:
      description: "Panel specs, inverter specs, BOM templates"
      classification: internal
    safety_protocols:
      description: "Installation safety, electrical standards, compliance"
      classification: internal

  episodic:
    installation_log:
      description: "Project installation milestones and status"
      write_access: [AGT-OPS-INST]
      classification: internal
    procurement_log:
      description: "Purchase orders, supplier communications, delivery tracking"
      write_access: [AGT-OPS-PROC]
      classification: internal
    site_assessments:
      description: "Roof condition, shading, structural, electrical evaluations"
      write_access: [AGT-OPS-SITE]
      classification: internal
    quality_inspections:
      description: "QA checklists, inspection results, commissioning records"
      write_access: [AGT-OPS-INST]
      classification: internal

  semantic:
    installation_playbook:
      description: "Step-by-step installation procedures"
      classification: internal
    procurement_rules:
      description: "PO approval thresholds, supplier selection criteria"
      classification: internal
    quality_checklists:
      description: "Pre-commissioning, commissioning, handover checklists"
      classification: internal
    approval_rules:
      ref: approvals.yml
      description: "When procurement needs founder approval"
      classification: internal

permissions:
  AGT-OPS-SITE:
    read: [engineering_standards, equipment_specs, site_assessments]
    write: [site_assessments]
    cannot_read: [founder_personal_notes, financial_models]

  AGT-OPS-PROC:
    read: [supplier_database, procurement_log, equipment_specs]
    write: [procurement_log]
    cannot_read: [founder_personal_notes, investor_correspondence]

  AGT-OPS-INST:
    read: [engineering_standards, installation_log, quality_checklists, safety_protocols]
    write: [installation_log, quality_inspections]
    cannot_read: [founder_personal_notes, financial_models]

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution."
  audit: "every memory write creates immutable audit record"
