# TAZ OS AI DEVELOPMENT HARNESS — Evaluation Metrics

id: EVAL-AID-001
name: AI Development Harness Evaluation Framework
harness: HAR-AID-001
version: 1.0.0

harness_metrics:
  - name: agent_performance_improvement
    target: "upward_trend"
    frequency: weekly
    owner: AGT-AID-BENCH
    measurement: average_agent_score_trend

  - name: failure_resolution_rate
    target: ">90%"
    frequency: weekly
    owner: AGT-AID-FAIL
    measurement: failures_resolved_divided_by_reported

  - name: cost_optimization
    target: "downward_trend"
    frequency: monthly
    owner: AGT-AID-WORKFLOW
    measurement: average_token_cost_per_cycle

  - name: prompt_effectiveness
    target: ">80% quality score"
    frequency: biweekly
    owner: AGT-AID-PROMPT
    measurement: prompt_output_quality_score

specialist_metrics:
  AGT-AID-PROMPT:
    - prompt_quality: { weight: 0.35 }
    - improvement_over_baseline: { weight: 0.30 }
    - generalizability: { weight: 0.20 }
    - cost_efficiency: { weight: 0.15 }

  AGT-AID-EVAL:
    - evaluation_accuracy: { weight: 0.30 }
    - coverage: { weight: 0.25 }
    - consistency: { weight: 0.25 }
    - actionable_feedback: { weight: 0.20 }

  AGT-AID-WORKFLOW:
    - reliability_improvement: { weight: 0.30 }
    - cost_reduction: { weight: 0.25 }
    - latency_improvement: { weight: 0.25 }
    - failure_recovery: { weight: 0.20 }

  AGT-AID-BENCH:
    - benchmark_completeness: { weight: 0.30 }
    - result_accuracy: { weight: 0.30 }
    - trend_detection: { weight: 0.20 }
    - report_clarity: { weight: 0.20 }

  AGT-AID-FAIL:
    - root_cause_accuracy: { weight: 0.35 }
    - fix_proposal_quality: { weight: 0.30 }
    - resolution_speed: { weight: 0.20 }
    - prevention_coverage: { weight: 0.15 }

continuous_improvement:
  cycle:
    - step: compare_planned_vs_actual
      owner: AGT-AID-BENCH
      input: system_performance_data
      output: variance_report
    - step: identify_bottlenecks
      owner: AGT-AID-FAIL
      input: variance_report
      output: bottleneck_list
    - step: update_artifacts
      owner: AGT-AID-PROMPT
      input: bottleneck_list
      output: optimized_prompts
      artifacts_affected: [prompt_library, optimization_playbook]
    - step: record_lessons
      owner: AGT-AID-FAIL
      input: bottleneck_list
      output: new_lessons
    - step: founder_review
      owner: HUM-000001
      input: biweekly_review
      output: approved_or_revised
      frequency: biweekly

  improvement_sources:
    - benchmark_trends: "agent performance over time"
    - failure_analysis: "root causes and fix effectiveness"
    - cost_tracking: "token usage and cost optimization"

  metrics_tracked:
    - agent_quality_score_trend
    - cost_per_cycle_trend
    - failure_rate_trend
    - prompt_improvement_delta

  review_cadence:
    daily: [failure_check, benchmark_status]
    weekly: [performance_review, cost_analysis]
    biweekly: [prompt_optimization_review, workflow_assessment]
    quarterly: [full_system_audit, model_routing_review]

evaluation_pipeline:
  1. agent_completes_task:
     output: raw_result
  2. self_check_passes:
     condition: all self_check questions return true
  3. evaluator_scores:
     metrics: specialist_metrics[agent_id]
     hard_fail_check: any metric with hard_fail_if condition
  4. result:
     - pass: store_artifact + update_memory
     - fail_hard: reject_output + alert_founder + log_failure
     - fail_soft: return_to_agent_with_feedback + retry
     - low_confidence: escalate_to_founder_with_context
