# TAZ OS AI DEVELOPMENT HARNESS — Shared Memory

id: MEM-AID-001
name: AI Development Harness Shared Memory
harness: HAR-AID-001
version: 1.0.0

layers:
  long_term:
    prompt_library:
      description: "Proven prompt templates, few-shot examples, CoT patterns"
      classification: internal
    benchmark_results:
      description: "Historical benchmark scores per agent/model"
      classification: internal
    failure_patterns:
      description: "Known failure modes and their fixes"
      classification: internal
    agent_performance_baselines:
      description: "Baseline metrics for each agent in the system"
      classification: internal

  episodic:
    prompt_experiments:
      description: "A/B tests on prompts, results, learnings"
      write_access: [AGT-AID-PROMPT]
      classification: internal
    workflow_changes:
      description: "Changes to agent workflows and their impact"
      write_access: [AGT-AID-WORKFLOW]
      classification: internal
    benchmark_runs:
      description: "Benchmark run results with model versions"
      write_access: [AGT-AID-BENCH]
      classification: internal
    failure_incidents:
      description: "Root cause analyses and fix proposals"
      write_access: [AGT-AID-FAIL]
      classification: internal

  semantic:
    optimization_playbook:
      description: "Proven techniques for prompt and workflow optimization"
      classification: internal
    evaluation_methodology:
      description: "How agents are scored and compared"
      classification: internal
    cost_optimization_rules:
      description: "When to use free vs paid models, token budget strategies"
      classification: internal

permissions:
  AGT-AID-PROMPT:
    read: [prompt_library, agent_performance_baselines, benchmark_results]
    write: [prompt_experiments]
    cannot_read: [raw_financial_models]

  AGT-AID-EVAL:
    read: [agent_performance_baselines, benchmark_results, evaluation_methodology]
    write: [benchmark_runs]
    cannot_read: []

  AGT-AID-WORKFLOW:
    read: [failure_patterns, optimization_playbook, agent_performance_baselines]
    write: [workflow_changes]
    cannot_read: []

  AGT-AID-BENCH:
    read: [agent_performance_baselines, benchmark_results, cost_optimization_rules]
    write: [benchmark_runs]
    cannot_read: []

  AGT-AID-FAIL:
    read: [failure_patterns, failure_incidents, prompt_library]
    write: [failure_incidents]
    cannot_read: []

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution."
  audit: "every memory write creates immutable audit record"
