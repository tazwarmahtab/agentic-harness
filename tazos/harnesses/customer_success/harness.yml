# TAZ OS Customer Success Harness
# Manages post-installation customer relationships: monitoring, support, upsell.

id: HAR-CSU-001
name: Customer Success Harness
venture: VEN-NETSO-001
version: 1.0.0
status: production
mission: >
  Ensure customer satisfaction and retention after solar installation.
  Monitor system performance, handle support requests, detect issues
  proactively, and identify upsell opportunities for additional capacity
  or new sites.

scope:
  in_scope: [customer_monitoring, support, issue_detection, upsell, retention]
  out_of_scope: [engineering, procurement, financial_modeling, legal]

kpis:
  - { name: customer_satisfaction_score, target: ">90%" }
  - { name: issue_resolution_time, target: "<24h" }
  - { name: upsell_conversion_rate, target: ">20%" }
  - { name: churn_rate, target: "<5%" }

inputs:
  - { source: executive, items: [priority_list, handoffs] }
  - { source: memory, items: [customer_profiles, installation_history] }

outputs:
  - { name: support_tickets, type: artifact }
  - { name: monitoring_reports, type: artifact }
  - { name: upsell_proposals, type: artifact }
