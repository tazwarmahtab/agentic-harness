# TAZ OS CUSTOMER SUCCESS HARNESS — Shared Memory

id: MEM-CSU-001
name: Customer Success Harness Shared Memory
harness: HAR-CSU-001
version: 1.0.0

layers:
  long_term:
    customer_records:
      description: "All customers with PPA terms, system specs, contact info"
      classification: confidential
    sla_definitions:
      description: "Response time and resolution time commitments per customer tier"
      classification: internal
    equipment_specs:
      description: "Installed equipment specs for troubleshooting"
      classification: internal

  episodic:
    support_tickets:
      description: "All support requests with resolution history"
      write_access: [AGT-CSU-SUP]
      classification: internal
    system_performance:
      description: "Daily performance readings from installed systems"
      write_access: [AGT-CSU-MONITOR]
      classification: internal
    upsell_pipeline:
      description: "Upsell opportunities and conversations"
      write_access: [AGT-CSU-UPSELL]
      classification: internal
    issue_log:
      description: "Predicted and actual issues with resolution"
      write_access: [AGT-CSU-DETECT, AGT-CSU-SUP]
      classification: internal

  semantic:
    troubleshooting_playbook:
      description: "Common issues and resolution procedures"
      classification: internal
    upsell_playbook:
      description: "When and how to propose additional capacity"
      classification: internal
    sla_rules:
      description: "How SLAs are measured and enforced"
      classification: internal

permissions:
  AGT-CSU-DETECT:
    read: [customer_records, system_performance, equipment_specs]
    write: [issue_log]
    cannot_read: [founder_personal_notes, financial_models]

  AGT-CSU-SUP:
    read: [customer_records, support_tickets, troubleshooting_playbook]
    write: [support_tickets, issue_log]
    cannot_read: [founder_personal_notes, financial_models]

  AGT-CSU-MONITOR:
    read: [customer_records, system_performance, sla_definitions]
    write: [system_performance]
    cannot_read: [founder_personal_notes, financial_models]

  AGT-CSU-UPSELL:
    read: [customer_records, upsell_pipeline, upsell_playbook]
    write: [upsell_pipeline]
    cannot_read: [founder_personal_notes, financial_models]

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution."
  audit: "every memory write creates immutable audit record"
