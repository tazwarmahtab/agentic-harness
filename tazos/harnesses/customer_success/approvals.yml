# TAZ OS CUSTOMER SUCCESS HARNESS — Approval Gates

id: POL-CSU-001
name: Customer Success Approval Gates
harness: HAR-CSU-001
version: 1.0.0
status: production

rules:
  - id: POL-CSU-CSU-001
    name: Upsell Offer Threshold
    category: commercial
    rule:
      if:
        action: send_upsell_offer
        value_bdt: { greater_than: 2000000 }
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 48

  - id: POL-CSU-CSU-002
    name: SLA Breach Escalation
    category: operations
    rule:
      if:
        action: sla_breach_detected
        severity: [high, critical]
      then: "Immediate escalation to Founder."
    action: escalate
    approval_owner: HUM-000001

auto_actions:
  - update_dashboard
  - log_support_ticket
  - monitor_system
  - generate_issue_report
  - update_customer_record

decision_queue_format:
  bundled: true
  summary_per_decision: [action_description, risk_assessment]
  actions_available: [approve_all, review_individually, reject]
  delivery: console_queue

delegation:
  enabled: true
  rule: "Delegation is explicit and temporary."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
