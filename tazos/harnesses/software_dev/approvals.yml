# TAZ OS SOFTWARE DEV HARNESS — Approval Gates

id: POL-DEV-001
name: Software Dev Approval Gates
harness: HAR-DEV-001
version: 1.0.0
status: production

rules:
  - id: POL-DEV-DEV-001
    name: Production Deploy
    category: engineering
    rule:
      if:
        action: deploy_to_production
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

  - id: POL-DEV-DEV-002
    name: Release Approval
    category: engineering
    rule:
      if:
        action: create_release
        version_type: [major, minor]
      then: "Requires Founder approval."
    action: require_approval
    approval_owner: HUM-000001
    approval_expires_hours: 24

auto_actions:
  - write_documentation
  - generate_prd
  - run_tests
  - review_code
  - update_sprint_log
  - update_roadmap

decision_queue_format:
  bundled: true
  summary_per_decision: [action_description, risk_assessment]
  actions_available: [approve_all, reject]
  delivery: console_queue

delegation:
  enabled: true
  rule: "Delegation is explicit and temporary."
  format:
    delegator: HUM-000001
    delegatee: [agent_id]
    capability: [specific_action]
    duration_hours: [48]
    auto_expires: true
  current_delegations: []
