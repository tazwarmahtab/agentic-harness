# TAZ OS FINANCE HARNESS — Shared Memory

id: MEM-FIN-001
name: Finance Harness Shared Memory
harness: HAR-FIN-001
version: 1.0.0

layers:
  long_term:
    ground_truth_constants:
      ref: ground_truth_constants
      description: "All financial numbers from core_economics.py. NEVER edit manually."
      classification: confidential
    financial_models:
      description: "IRR, NPV, DCF models with version history"
      classification: confidential
    cap_table:
      description: "Capitalization table, equity structure"
      classification: restricted
    accounting_standards:
      description: "IFRS/Bangladesh accounting standards for solar projects"
      classification: internal
    idcol_debt_terms:
      description: "IDCOL financing: 80% at 6% p.a., 10 years, DSCR requirements"
      classification: confidential

  episodic:
    cash_flow_history:
      description: "Monthly cash flow records, receivables, payables"
      write_access: [AGT-FIN-CASH]
      classification: confidential
    investor_updates:
      description: "Sent investor updates with board packs"
      write_access: [AGT-FIN-DECK]
      classification: restricted
    financial_forecasts:
      description: "Projected cash flows, revenue forecasts"
      write_access: [AGT-FIN-CASH, AGT-FIN-UNIT]
      classification: confidential
    audit_trail:
      description: "All financial calculation changes with rationale"
      write_access: [AGT-FIN-CASH, AGT-FIN-UNIT]
      classification: internal

  semantic:
    valuation_methods:
      description: "DCF, IRR, payback period calculation methods"
      classification: internal
    financial_assumptions:
      ref: ground_truth_constants
      description: "All financial assumptions locked by core_economics.py"
      classification: confidential
    reporting_standards:
      description: "How financial reports are structured and formatted"
      classification: internal
    approval_rules:
      ref: approvals.yml
      description: "When financial models need founder approval"
      classification: internal

permissions:
  AGT-FIN-CASH:
    read: [ground_truth_constants, cash_flow_history, financial_models, idcol_debt_terms]
    write: [cash_flow_history, financial_forecasts]
    cannot_read: [founder_personal_notes, cap_table]

  AGT-FIN-DECK:
    read: [ground_truth_constants, financial_models, investor_updates, cap_table]
    write: [investor_updates]
    cannot_read: [founder_personal_notes]

  AGT-FIN-UNIT:
    read: [ground_truth_constants, financial_models, idcol_debt_terms, accounting_standards]
    write: [financial_models, financial_forecasts]
    cannot_read: [founder_personal_notes, cap_table]

update_rules:
  agents_submit_memory_candidates: true
  reflection_engine_decides: [store, reject, summarize, merge, version]
  purpose: "Prevent memory pollution. No agent can write arbitrary memory."
  audit: "every memory write creates immutable audit record"
