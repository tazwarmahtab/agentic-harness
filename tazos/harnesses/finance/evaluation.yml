# TAZ OS FINANCE HARNESS — Evaluation Metrics

id: EVAL-FIN-001
name: Finance Harness Evaluation Framework
harness: HAR-FIN-001
version: 1.0.0

harness_metrics:
  - name: model_accuracy
    target: ">95%"
    frequency: monthly
    owner: AGT-FIN-UNIT
    measurement: model_output_vs_ground_truth_variance

  - name: investor_update_timeliness
    target: "100% on schedule"
    frequency: monthly
    owner: AGT-FIN-DECK
    measurement: updates_sent_by_deadline

  - name: number_discipline_violations
    target: "0"
    frequency: realtime
    owner: AGT-FIN-UNIT
    measurement: zero_wrong_rates_in_outputs

  - name: cash_forecast_accuracy
    target: ">90%"
    frequency: monthly
    owner: AGT-FIN-CASH
    measurement: forecast_vs_actual_variance

specialist_metrics:
  AGT-FIN-CASH:
    - forecast_accuracy: { weight: 0.35 }
    - data_completeness: { weight: 0.25 }
    - timeliness: { weight: 0.20 }
    - number_discipline: { weight: 0.20, hard_fail_if: "blended_rate_used" }

  AGT-FIN-DECK:
    - presentation_quality: { weight: 0.30 }
    - data_accuracy: { weight: 0.30, hard_fail_if: "wrong_financial_constants" }
    - timeliness: { weight: 0.20 }
    - founder_approval_rate: { weight: 0.20 }

  AGT-FIN-UNIT:
    - number_discipline: { weight: 0.40, hard_fail_if: "blended_rate_for_savings" }
    - model_accuracy: { weight: 0.30 }
    - assumption_documentation: { weight: 0.15 }
    - dscr_monitoring: { weight: 0.15, hard_fail_if: "dscr_breach_unflagged" }

continuous_improvement:
  cycle:
    - step: compare_planned_vs_actual
      owner: AGT-FIN-UNIT
      input: financial_outcomes
      output: variance_report
    - step: identify_bottlenecks_and_failures
      owner: AGT-FIN-CASH
      input: variance_report
      output: bottleneck_list
    - step: update_artifacts
      owner: AGT-FIN-UNIT
      input: bottleneck_list
      output: updated_models_and_sops
      artifacts_affected: [financial_models, ground_truth_constants]
    - step: record_lessons
      owner: AGT-FIN-CASH
      input: bottleneck_list
      output: new_lessons_entries
    - step: update_benchmarks
      owner: AGT-FIN-UNIT
      input: specialist_metrics
      output: benchmark_update
    - step: founder_review
      owner: HUM-000001
      input: monthly_review
      output: approved_or_revised
      frequency: monthly

  improvement_sources:
    - monthly_review: "financial model accuracy vs actuals"
    - lessons: "calculation errors and corrections"
    - forecast_variance: "planned vs actual cash flow"
    - specialist_evaluations: evaluation scores above

  metrics_tracked:
    - model_accuracy_vs_ground_truth
    - forecast_error_margin
    - hard_fail_count_per_period
    - approval_latency_hours

  review_cadence:
    daily: [cash_position_check, receivables_status]
    weekly: [forecast_update, model_review]
    monthly: [investor_update, board_pack, model_recalibration]
    quarterly: [full_financial_audit, assumption_review]

evaluation_pipeline:
  1. agent_completes_task:
     output: raw_result
  2. self_check_passes:
     condition: all self_check questions return true
  3. evaluator_scores:
     metrics: specialist_metrics[agent_id]
     hard_fail_check: any metric with hard_fail_if condition
  4. result:
     - pass: store_artifact + update_memory
     - fail_hard: reject_output + alert_founder + log_failure
     - fail_soft: return_to_agent_with_feedback + retry
     - low_confidence: escalate_to_founder_with_context
